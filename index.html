<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TR Plaka Kontrol - Gelişmiş Algılama</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }
        
        .container { max-width: 700px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 30px; }
        
        h1 { font-size: 28px; margin-bottom: 10px; }
        
        .subtitle { color: #94a3b8; font-size: 14px; }
        
        .card {
            background: rgba(30, 41, 59, 0.9);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
        }
        
        .upload-area {
            border: 3px dashed rgba(245, 158, 11, 0.4);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(245, 158, 11, 0.05);
            margin-bottom: 20px;
        }
        
        .upload-area:hover { border-color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
        .upload-area.has-image { border-color: #10b981; background: rgba(16, 185, 129, 0.1); display: none; }
        
        .upload-icon { font-size: 48px; margin-bottom: 15px; }
        
        .file-input { display: none; }
        
        .preview-container {
            display: none;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 15px;
        }
        
        .preview-container.show { display: block; }
        
        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }
        
        .analysis-overlay {
            position: relative;
            margin-top: 15px;
        }
        
        .region-markers {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .file-info {
            margin-top: 15px;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .remove-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .btn {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }
        
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .loading.show { display: block; }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #f59e0b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .result {
            display: none;
            margin-top: 24px;
            animation: slideUp 0.4s ease;
        }
        
        .result.show { display: block; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-header {
            text-align: center;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        
        .result-original {
            background: linear-gradient(135deg, rgba(5, 150, 105, 0.2), rgba(16, 185, 129, 0.2));
            border: 2px solid #10b981;
        }
        
        .result-suspicious {
            background: linear-gradient(135deg, rgba(217, 119, 6, 0.2), rgba(245, 158, 11, 0.2));
            border: 2px solid #f59e0b;
        }
        
        .result-fake {
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.2), rgba(239, 68, 68, 0.2));
            border: 2px solid #ef4444;
        }
        
        .authenticity-score {
            font-size: 64px;
            font-weight: 800;
            margin: 15px 0;
        }
        
        .features-detailed {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }
        
        .feature-row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border-left: 4px solid;
        }
        
        .feature-row.pass { border-left-color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .feature-row.fail { border-left-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .feature-row.warning { border-left-color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
        
        .feature-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: rgba(255,255,255,0.1);
        }
        
        .feature-row.pass .feature-icon { background: #10b981; }
        .feature-row.fail .feature-icon { background: #ef4444; }
        .feature-row.warning .feature-icon { background: #f59e0b; }
        
        .feature-content { flex: 1; }
        
        .feature-title { font-weight: 600; margin-bottom: 4px; }
        
        .feature-desc { font-size: 12px; color: #94a3b8; }
        
        .confidence-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        
        .confidence-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.5s ease;
        }
        
        .plate-reading {
            background: white;
            color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 4px;
            text-align: center;
            margin: 20px 0;
            position: relative;
            padding-left: 60px;
        }
        
        .plate-reading::before {
            content: 'TR';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 50px;
            background: #0033a0;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            border-radius: 12px 0 0 12px;
            font-family: sans-serif;
        }
        
        .error-message {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            color: #fca5a5;
            font-size: 13px;
        }
        
        .error-message.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚗 TR Plaka Kontrol</h1>
            <p class="subtitle">Mavi şerit, mühür ve hologram analizi</p>
        </div>
        
        <div class="card">
            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📸</div>
                <div style="font-weight: 600; font-size: 18px; margin-bottom: 8px;">Plaka Fotoğrafı Yükle</div>
                <div style="color: #94a3b8; font-size: 13px;">Mavi TR şeridi net görünmeli</div>
                <input type="file" id="fileInput" class="file-input" accept="image/jpeg,image/png,image/webp">
            </div>
            
            <div class="preview-container" id="previewContainer">
                <img id="previewImage" class="preview-image">
                <div class="file-info">
                    <div>
                        <div id="fileName" style="font-weight: 600;"></div>
                        <div id="fileDetails" style="font-size: 12px; color: #94a3b8; margin-top: 4px;"></div>
                    </div>
                    <button class="remove-btn" onclick="removeImage()">🗑️ Kaldır</button>
                </div>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div style="color: #94a3b8;">Plaka analiz ediliyor...</div>
            </div>
            
            <button class="btn btn-primary" id="analyzeBtn" onclick="analyzePlate()" disabled>
                <span>🔍</span> Detaylı Analiz Et
            </button>
            
            <div class="result" id="result"></div>
        </div>
    </div>

    <script>
        let currentImage = null;
        let imageData = null;
        
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const analyzeBtn = document.getElementById('analyzeBtn');
        
        fileInput.addEventListener('change', handleFileSelect);
        
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            hideError();
            
            if (!file.type.match(/image\/(jpeg|png|webp)/)) {
                showError('❌ Sadece JPG, PNG veya WEBP formatları desteklenir.');
                return;
            }
            
            if (file.size > 5 * 1024 * 1024) {
                showError('❌ Dosya boyutu 5MB\'ı geçemez.');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (e) => {
                currentImage = e.target.result;
                previewImage.src = currentImage;
                previewImage.onload = () => {
                    document.getElementById('fileName').textContent = file.name;
                    document.getElementById('fileDetails').textContent = 
                        `${(file.size/1024).toFixed(1)} KB • ${previewImage.naturalWidth}x${previewImage.naturalHeight}px`;
                    
                    uploadArea.classList.add('has-image');
                    previewContainer.classList.add('show');
                    analyzeBtn.disabled = false;
                };
            };
            reader.readAsDataURL(file);
        }
        
        function removeImage() {
            currentImage = null;
            fileInput.value = '';
            uploadArea.classList.remove('has-image');
            previewContainer.classList.remove('show');
            analyzeBtn.disabled = true;
            document.getElementById('result').classList.remove('show');
            hideError();
        }
        
        function showError(msg) {
            const err = document.getElementById('errorMessage');
            err.textContent = msg;
            err.classList.add('show');
        }
        
        function hideError() {
            document.getElementById('errorMessage').classList.remove('show');
        }
        
        // GELİŞMİŞ PLAKA ANALİZİ
        function analyzePlate() {
            if (!currentImage) return;
            
            document.getElementById('loading').classList.add('show');
            analyzeBtn.disabled = true;
            
            setTimeout(() => {
                performAdvancedAnalysis();
                document.getElementById('loading').classList.remove('show');
                analyzeBtn.disabled = false;
            }, 500);
        }
        
        function performAdvancedAnalysis() {
            const img = previewImage;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            ctx.drawImage(img, 0, 0);
            
            const width = canvas.width;
            const height = canvas.height;
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            
            // 1. MAVİ TR ŞERİDİ ANALİZİ (Sol kısım)
            // Mavi: R düşük, G orta, Yüksek
            const leftStripWidth = width * 0.15;
            let bluePixels = 0;
            let totalStripPixels = 0;
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < leftStripWidth; x++) {
                    const idx = (y * width + x) * 4;
                    const r = data[idx], g = data[idx+1], b = data[idx+2];
                    
                    // Mavi tespiti: B > R+20 ve B > G+10
                    if (b > r + 20 && b > g + 10 && b > 100) {
                        bluePixels++;
                    }
                    totalStripPixels++;
                }
            }
            
            const blueRatio = bluePixels / totalStripPixels;
            const hasBlueStrip = blueRatio > 0.3;
            
            // 2. PLAKA BÖLGESİ ANALİZİ (Orta kısım - beyaz zemin)
            const plateStartX = width * 0.15;
            const plateEndX = width * 0.95;
            const plateStartY = height * 0.2;
            const plateEndY = height * 0.8;
            
            let whitePixels = 0;
            let blackPixels = 0;
            let plateTotalPixels = 0;
            let edgeSharpness = 0;
            let prevBrightness = 0;
            
            for (let y = Math.floor(plateStartY); y < plateEndY; y++) {
                for (let x = Math.floor(plateStartX); x < plateEndX; x++) {
                    const idx = (y * width + x) * 4;
                    const r = data[idx], g = data[idx+1], b = data[idx+2];
                    const brightness = (r + g + b) / 3;
                    
                    // Beyaz zemin (yüksek parlaklık)
                    if (brightness > 180 && r > 170 && g > 170 && b > 170) {
                        whitePixels++;
                    }
                    
                    // Siyah karakterler (düşük parlaklık)
                    if (brightness < 80) {
                        blackPixels++;
                    }
                    
                    // Kenar netliği (ani değişimler)
                    if (prevBrightness > 0) {
                        const diff = Math.abs(brightness - prevBrightness);
                        if (diff > 100) edgeSharpness++;
                    }
                    prevBrightness = brightness;
                    
                    plateTotalPixels++;
                }
            }
            
            const whiteRatio = whitePixels / plateTotalPixels;
            const blackRatio = blackPixels / plateTotalPixels;
            const hasWhiteBackground = whiteRatio > 0.4;
            const hasBlackCharacters = blackRatio > 0.05;
            const sharpnessScore = Math.min(100, (edgeSharpness / plateTotalPixels) * 1000);
            
            // 3. HOLOGRAM ANALİZİ (Orta şerit - yatay dalgalı desen)
            const centerY = height / 2;
            const hologramBand = height * 0.1;
            let hologramEdges = 0;
            let hologramVariance = 0;
            let prevLineBrightness = 0;
            
            for (let y = Math.floor(centerY - hologramBand/2); y < centerY + hologramBand/2; y += 2) {
                let lineBrightness = 0;
                let linePixels = 0;
                
                for (let x = Math.floor(plateStartX); x < plateEndX; x++) {
                    const idx = (y * width + x) * 4;
                    const brightness = (data[idx] + data[idx+1] + data[idx+2]) / 3;
                    lineBrightness += brightness;
                    linePixels++;
                }
                
                const avgLineBrightness = lineBrightness / linePixels;
                
                if (prevLineBrightness > 0) {
                    const diff = Math.abs(avgLineBrightness - prevLineBrightness);
                    if (diff > 15) hologramEdges++;
                    hologramVariance += diff;
                }
                prevLineBrightness = avgLineBrightness;
            }
            
            const hasHologram = hologramEdges > 3 && hologramVariance > 100;
            
            // 4. MÜHÜR ANALİZİ (Sol üst köşe - dairesel koyu bölge)
            const sealSize = Math.min(width, height) * 0.2;
            let sealDarkPixels = 0;
            let sealPattern = 0;
            
            for (let y = 0; y < sealSize; y += 2) {
                for (let x = 0; x < sealSize; x += 2) {
                    const idx = (y * width + x) * 4;
                    const brightness = (data[idx] + data[idx+1] + data[idx+2]) / 3;
                    
                    if (brightness < 100) sealDarkPixels++;
                    
                    // Merkeze doğru yoğunluk
                    const dist = Math.sqrt(x*x + y*y);
                    if (dist < sealSize * 0.5 && brightness < 120) {
                        sealPattern++;
                    }
                }
            }
            
            const sealArea = (sealSize/2) * (sealSize/2);
            const hasSeal = (sealDarkPixels / sealArea) > 0.15 || (sealPattern / sealArea) > 0.05;
            
            // SKOR HESAPLAMA (Her özellik ağırlıklı)
            let totalScore = 0;
            const weights = {
                blueStrip: 25,    // Mavi TR şeridi çok önemli
                whiteBg: 20,      // Beyaz zemin
                blackChars: 15,   // Siyah karakterler
                sharpness: 15,    // Kenar netliği
                hologram: 15,     // Hologram
                seal: 10          // Mühür
            };
            
            const scores = {
                blueStrip: hasBlueStrip ? weights.blueStrip : 0,
                whiteBg: hasWhiteBackground ? weights.whiteBg : (whiteRatio > 0.2 ? weights.whiteBg * 0.5 : 0),
                blackChars: hasBlackCharacters ? weights.blackChars : 0,
                sharpness: Math.min(weights.sharpness, (sharpnessScore / 100) * weights.sharpness),
                hologram: hasHologram ? weights.hologram : weights.hologram * 0.3,
                seal: hasSeal ? weights.seal : weights.seal * 0.3
            };
            
            Object.values(scores).forEach(s => totalScore += s);
            
            // DURUM BELİRLEME
            let status, statusClass, title, message;
            
            if (totalScore >= 75 && hasBlueStrip && hasWhiteBackground) {
                status = 'original';
                statusClass = 'result-original';
                title = '✅ ORİJİNAL PLAKA';
                message = 'Tüm güvenlik özellikleri tespit edildi. Bu plaka TSE ve EGM standartlarına tam uygundur.';
            } else if (totalScore >= 50 && (hasBlueStrip || hasWhiteBackground)) {
                status = 'suspicious';
                statusClass = 'result-suspicious';
                title = '⚠️ KONTROL GEREKLİ';
                message = 'Bazı özellikler zayıf veya belirsiz. Daha net fotoğraf çekin veya manuel kontrol yapın.';
            } else {
                status = 'fake';
                statusClass = 'result-fake';
                title = '❌ SAHTE / STANDART DIŞI';
                message = 'Güvenlik özellikleri yetersiz. Bu plaka orijinal olmayabilir.';
            }
            
            // SONUÇ GÖSTER
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result show';
            
            resultDiv.innerHTML = `
                <div class="result-header ${statusClass}">
                    <div style="font-size: 14px; opacity: 0.9; margin-bottom: 10px;">ANALİZ SONUCU</div>
                    <div class="authenticity-score" style="color: ${status === 'original' ? '#4ade80' : status === 'suspicious' ? '#fbbf24' : '#f87171'}">
                        %${Math.round(totalScore)}
                    </div>
                    <h2 style="margin-bottom: 8px;">${title}</h2>
                    <p style="font-size: 14px; opacity: 0.9; line-height: 1.5;">${message}</p>
                </div>
                
                <div class="features-detailed">
                    <div class="feature-row ${scores.blueStrip > 20 ? 'pass' : scores.blueStrip > 10 ? 'warning' : 'fail'}">
                        <div class="feature-icon">${scores.blueStrip > 20 ? '✓' : scores.blueStrip > 10 ? '!' : '✗'}</div>
                        <div class="feature-content">
                            <div class="feature-title">Mavi TR Şeridi</div>
                            <div class="feature-desc">${hasBlueStrip ? 'Tespit edildi (%' + Math.round(blueRatio*100) + ')' : 'Zayıf veya yok'}</div>
                            <div class="confidence-bar"><div class="confidence-fill" style="width: ${(scores.blueStrip/weights.blueStrip)*100}%; background: ${scores.blueStrip > 20 ? '#10b981' : scores.blueStrip > 10 ? '#f59e0b' : '#ef4444'}"></div></div>
                        </div>
                    </div>
                    
                    <div class="feature-row ${scores.whiteBg > 15 ? 'pass' : scores.whiteBg > 8 ? 'warning' : 'fail'}">
                        <div class="feature-icon">${scores.whiteBg > 15 ? '✓' : scores.whiteBg > 8 ? '!' : '✗'}</div>
                        <div class="feature-content">
                            <div class="feature-title">Beyaz Zemin</div>
                            <div class="feature-desc">${hasWhiteBackground ? 'Standart beyaz (%' + Math.round(whiteRatio*100) + ')' : 'Zemin rengi düşük'}</div>
                            <div class="confidence-bar"><div class="confidence-fill" style="width: ${(scores.whiteBg/weights.whiteBg)*100}%; background: ${scores.whiteBg > 15 ? '#10b981' : scores.whiteBg > 8 ? '#f59e0b' : '#ef4444'}"></div></div>
                        </div>
                    </div>
                    
                    <div class="feature-row ${scores.blackChars > 10 ? 'pass' : scores.blackChars > 5 ? 'warning' : 'fail'}">
                        <div class="feature-icon">${scores.blackChars > 10 ? '✓' : scores.blackChars > 5 ? '!' : '✗'}</div>
                        <div class="feature-content">
                            <div class="feature-title">Siyah Karakterler</div>
                            <div class="feature-desc">${hasBlackCharacters ? 'Net siyah harfler (%' + Math.round(blackRatio*100) + ')' : 'Karakterler belirsiz'}</div>
                            <div class="confidence-bar"><div class="confidence-fill" style="width: ${(scores.blackChars/weights.blackChars)*100}%; background: ${scores.blackChars > 10 ? '#10b981' : scores.blackChars > 5 ? '#f59e0b' : '#ef4444'}"></div></div>
                        </div>
                    </div>
                    
                    <div class="feature-row ${scores.sharpness > 10 ? 'pass' : scores.sharpness > 5 ? 'warning' : 'fail'}">
                        <div class="feature-icon">${scores.sharpness > 10 ? '✓' : scores.sharpness > 5 ? '!' : '✗'}</div>
                        <div class="feature-content">
                            <div class="feature-title">Kenar Netliği</div>
                            <div class="feature-desc">Keskinlik skoru: ${Math.round(sharpnessScore)}/100</div>
                            <div class="confidence-bar"><div class="confidence-fill" style="width: ${(scores.sharpness/weights.sharpness)*100}%; background: ${scores.sharpness > 10 ? '#10b981' : scores.sharpness > 5 ? '#f59e0b' : '#ef4444'}"></div></div>
                        </div>
                    </div>
                    
                    <div class="feature-row ${scores.hologram > 10 ? 'pass' : scores.hologram > 5 ? 'warning' : 'fail'}">
                        <div class="feature-icon">${scores.hologram > 10 ? '✓' : scores.hologram > 5 ? '!' : '✗'}</div>
                        <div class="feature-content">
                            <div class="feature-title">Hologram Şeridi</div>
                            <div class="feature-desc">${hasHologram ? 'Dalgalı desen tespit edildi' : 'Belirsiz veya yok'}</div>
                            <div class="confidence-bar"><div class="confidence-fill" style="width: ${(scores.hologram/weights.hologram)*100}%; background: ${scores.hologram > 10 ? '#10b981' : scores.hologram > 5 ? '#f59e0b' : '#ef4444'}"></div></div>
                        </div>
                    </div>
                    
                    <div class="feature-row ${scores.seal > 7 ? 'pass' : scores.seal > 3 ? 'warning' : 'fail'}">
                        <div class="feature-icon">${scores.seal > 7 ? '✓' : scores.seal > 3 ? '!' : '✗'}</div>
                        <div class="feature-content">
                            <div class="feature-title">Mühür/Damga</div>
                            <div class="feature-desc">${hasSeal ? 'Sol üst mühürü tespit edildi' : 'Mühür belirsiz'}</div>
                            <div class="confidence-bar"><div class="confidence-fill" style="width: ${(scores.seal/weights.seal)*100}%; background: ${scores.seal > 7 ? '#10b981' : scores.seal > 3 ? '#f59e0b' : '#ef4444'}"></div></div>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
