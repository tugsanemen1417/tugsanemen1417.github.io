<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TR Plaka Kontrol</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }
        
        .container { max-width: 600px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 30px; }
        
        h1 { font-size: 28px; margin-bottom: 10px; }
        
        .subtitle { color: #94a3b8; font-size: 14px; }
        
        .card {
            background: rgba(30, 41, 59, 0.9);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
        }
        
        .upload-area {
            border: 3px dashed rgba(245, 158, 11, 0.4);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(245, 158, 11, 0.05);
            margin-bottom: 20px;
            position: relative;
        }
        
        .upload-area:hover {
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
        }
        
        .upload-area.dragover {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            transform: scale(1.02);
        }
        
        .upload-area.has-image {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }
        
        .upload-area.error {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .upload-title {
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 8px;
        }
        
        .upload-subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        
        .upload-limits {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            font-size: 11px;
            color: #64748b;
        }
        
        .limit-badge {
            background: rgba(255,255,255,0.1);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .file-input {
            display: none;
        }
        
        .preview-container {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
        }
        
        .preview-container.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }
        
        .file-info {
            margin-top: 12px;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .file-name {
            color: white;
            font-weight: 500;
        }
        
        .remove-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .remove-btn:hover {
            background: rgba(239, 68, 68, 0.3);
        }
        
        .error-message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #fca5a5;
            font-size: 13px;
        }
        
        .error-message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(245, 158, 11, 0.5);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .result {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .result.show {
            display: block;
            animation: slideUp 0.4s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #f59e0b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .upload-area { padding: 30px 20px; }
            .upload-title { font-size: 16px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚗 TR Plaka Kontrol</h1>
            <p class="subtitle">Fotoğraf yükle ve otomatik analiz et</p>
        </div>
        
        <div class="card">
            <!-- Dosya Yükleme Alanı -->
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📸</div>
                <div class="upload-title">Plaka Fotoğrafı Yükle</div>
                <div class="upload-subtitle">Hologram ve mühür net görünmeli</div>
                <div class="upload-limits">
                    <span class="limit-badge">📁 Max 5MB</span>
                    <span class="limit-badge">🖼️ JPG, PNG, WEBP</span>
                    <span class="limit-badge">📏 Min 300x200px</span>
                </div>
                <input type="file" id="fileInput" class="file-input" accept="image/jpeg,image/jpg,image/png,image/webp">
            </div>
            
            <!-- Hata Mesajı -->
            <div class="error-message" id="errorMessage"></div>
            
            <!-- Önizleme -->
            <div class="preview-container" id="previewContainer">
                <img id="previewImage" class="preview-image" alt="Plaka önizleme">
                <div class="file-info">
                    <div>
                        <div class="file-name" id="fileName">-</div>
                        <div id="fileSize" style="font-size: 11px; margin-top: 2px;">-</div>
                    </div>
                    <button class="remove-btn" onclick="removeFile()">🗑️ Kaldır</button>
                </div>
            </div>
            
            <!-- Yükleme Animasyonu -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div style="color: #94a3b8;">Fotoğraf analiz ediliyor...</div>
            </div>
            
            <!-- Analiz Butonu -->
            <button class="btn btn-primary" id="analyzeBtn" onclick="analyze()" disabled>
                <span>🔍</span> Analiz Et
            </button>
            
            <!-- Sonuç -->
            <div class="result" id="result"></div>
        </div>
    </div>

    <script>
        // Sınırlar
        const LIMITS = {
            maxSize: 5 * 1024 * 1024, // 5MB
            minWidth: 300,
            minHeight: 200,
            allowedTypes: ['image/jpeg', 'image/jpg', 'image/png', 'image/webp'],
            allowedExtensions: ['.jpg', '.jpeg', '.png', '.webp']
        };
        
        let currentFile = null;
        let currentImage = null;
        
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const errorMessage = document.getElementById('errorMessage');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const analyzeBtn = document.getElementById('analyzeBtn');
        
        // Tıklama ile dosya seçimi
        uploadArea.addEventListener('click', (e) => {
            if (e.target !== fileInput) {
                fileInput.click();
            }
        });
        
        // Dosya seçildiğinde
        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                validateAndLoadFile(e.target.files[0]);
            }
        });
        
        // Drag & Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, preventDefaults, false);
        });
        
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
        
        uploadArea.addEventListener('dragenter', () => {
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                validateAndLoadFile(files[0]);
            }
        });
        
        // Dosya doğrulama ve yükleme
        function validateAndLoadFile(file) {
            hideError();
            
            // Tip kontrolü
            const fileExtension = '.' + file.name.split('.').pop().toLowerCase();
            const isValidType = LIMITS.allowedTypes.includes(file.type) || 
                               LIMITS.allowedExtensions.includes(fileExtension);
            
            if (!isValidType) {
                showError(`❌ Geçersiz dosya tipi: ${file.type || fileExtension}<br><br>` +
                         `✅ İzin verilenler: JPG, JPEG, PNG, WEBP`);
                uploadArea.classList.add('error');
                setTimeout(() => uploadArea.classList.remove('error'), 500);
                return;
            }
            
            // Boyut kontrolü
            if (file.size > LIMITS.maxSize) {
                const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
                const limitMB = (LIMITS.maxSize / (1024 * 1024));
                showError(`❌ Dosya çok büyük: ${sizeMB} MB<br><br>` +
                         `✅ Maximum boyut: ${limitMB} MB`);
                uploadArea.classList.add('error');
                setTimeout(() => uploadArea.classList.remove('error'), 500);
                return;
            }
            
            // Okuma
            const reader = new FileReader();
            
            reader.onload = (e) => {
                const img = new Image();
                
                img.onload = () => {
                    // Boyut kontrolü
                    if (img.width < LIMITS.minWidth || img.height < LIMITS.minHeight) {
                        showError(`❌ Görsel çok küçük: ${img.width}x${img.height}px<br><br>` +
                                 `✅ Minimum boyut: ${LIMITS.minWidth}x${LIMITS.minHeight}px`);
                        return;
                    }
                    
                    // Başarılı
                    currentFile = file;
                    currentImage = e.target.result;
                    
                    showPreview(file, img);
                };
                
                img.onerror = () => {
                    showError('❌ Görsel okunamadı. Dosya bozuk olabilir.');
                };
                
                img.src = e.target.result;
            };
            
            reader.onerror = () => {
                showError('❌ Dosya okunurken hata oluştu.');
            };
            
            reader.readAsDataURL(file);
        }
        
        // Önizleme göster
        function showPreview(file, img) {
            previewImage.src = currentImage;
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = 
                `${(file.size / 1024).toFixed(1)} KB • ${img.width}x${img.height}px`;
            
            previewContainer.classList.add('show');
            uploadArea.classList.add('has-image');
            uploadArea.style.display = 'none';
            
            analyzeBtn.disabled = false;
            hideError();
        }
        
        // Dosya kaldır
        function removeFile() {
            currentFile = null;
            currentImage = null;
            fileInput.value = '';
            
            previewContainer.classList.remove('show');
            uploadArea.classList.remove('has-image');
            uploadArea.style.display = 'block';
            
            analyzeBtn.disabled = true;
            document.getElementById('result').classList.remove('show');
            hideError();
        }
        
        // Hata göster
        function showError(message) {
            errorMessage.innerHTML = message;
            errorMessage.classList.add('show');
        }
        
        // Hata gizle
        function hideError() {
            errorMessage.classList.remove('show');
        }
        
        // Analiz
        function analyze() {
            if (!currentImage) return;
            
            document.getElementById('loading').classList.add('show');
            analyzeBtn.disabled = true;
            
            setTimeout(() => {
                performAnalysis();
                document.getElementById('loading').classList.remove('show');
                analyzeBtn.disabled = false;
            }, 1500);
        }
        
        // Analiz işlemi
        function performAnalysis() {
            const img = previewImage;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            ctx.drawImage(img, 0, 0);
            
            try {
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                // Basit parlaklık analizi
                let totalBrightness = 0;
                let darkPixels = 0;
                let lightPixels = 0;
                
                for (let i = 0; i < data.length; i += 4) {
                    const brightness = (data[i] + data[i+1] + data[i+2]) / 3;
                    totalBrightness += brightness;
                    
                    if (brightness < 50) darkPixels++;
                    if (brightness > 200) lightPixels++;
                }
                
                const avgBrightness = totalBrightness / (data.length / 4);
                const totalPixels = data.length / 4;
                const contrast = (darkPixels + lightPixels) / totalPixels;
                
                // Sonuç
                const resultDiv = document.getElementById('result');
                resultDiv.classList.add('show');
                
                const isValid = avgBrightness > 80 && avgBrightness < 220 && contrast > 0.3;
                
                resultDiv.innerHTML = `
                    <div style="text-align: center; margin-bottom: 20px;">
                        <div style="font-size: 48px; margin-bottom: 10px;">${isValid ? '✅' : '⚠️'}</div>
                        <div style="font-size: 20px; font-weight: 700; color: ${isValid ? '#4ade80' : '#fbbf24'};">
                            ${isValid ? 'ANALİZ TAMAMLANDI' : 'DÜŞÜK KALİTE'}
                        </div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px;">
                        <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px;">
                            <div style="color: #94a3b8; font-size: 11px;">Parlaklık</div>
                            <div style="font-weight: 600; margin-top: 4px;">${avgBrightness.toFixed(0)}/255</div>
                        </div>
                        <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px;">
                            <div style="color: #94a3b8; font-size: 11px;">Kontrast</div>
                            <div style="font-weight: 600; margin-top: 4px;">${(contrast * 100).toFixed(0)}%</div>
                        </div>
                        <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px;">
                            <div style="color: #94a3b8; font-size: 11px;">Boyut</div>
                            <div style="font-weight: 600; margin-top: 4px;">${canvas.width}x${canvas.height}</div>
                        </div>
                        <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px;">
                            <div style="color: #94a3b8; font-size: 11px;">Durum</div>
                            <div style="font-weight: 600; margin-top: 4px; color: ${isValid ? '#4ade80' : '#fbbf24'};">
                                ${isValid ? '✓ Uygun' : '⚠️ Kontrol Et'}
                            </div>
                        </div>
                    </div>
                `;
                
            } catch (err) {
                showError('Analiz hatası: ' + err.message);
            }
        }
    </script>
</body>
</html>
