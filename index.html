<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plaka Kimlik Analizi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0c0f;
      --surface:   #10141a;
      --border:    #1e2530;
      --accent:    #00e5ff;
      --warn:      #ff4d4d;
      --ok:        #00ff99;
      --mute:      #3a4455;
      --text:      #c8d4e8;
      --textdim:   #5a6a82;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'IBM Plex Sans', sans-serif;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); }

    /* ─── HEADER ─── */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 22px 40px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .logo {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 6px;
      display: grid; place-items: center;
      font-family: var(--font-mono);
      font-weight: 700;
      color: #000;
      font-size: 15px;
      letter-spacing: -1px;
    }
    header h1 { font-family: var(--font-mono); font-size: 16px; font-weight: 600; letter-spacing: 2px; color: var(--accent); }
    header span { font-size: 12px; color: var(--textdim); margin-left: auto; font-family: var(--font-mono); }

    /* ─── LAYOUT ─── */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media(max-width:700px){ main { grid-template-columns: 1fr; } }

    /* ─── CARDS ─── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content:'';
      position: absolute; top:0; left:0; right:0; height:2px;
      background: linear-gradient(90deg, var(--accent), transparent);
    }
    .card-title {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--textdim);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    /* ─── DROP ZONE ─── */
    #dropzone {
      border: 2px dashed var(--mute);
      border-radius: 10px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
    }
    #dropzone.hover { border-color: var(--accent); background: rgba(0,229,255,.04); }
    #dropzone input { position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%; }
    .drop-icon {
      font-size: 40px;
      margin-bottom: 12px;
      filter: grayscale(1);
      transition: filter .2s;
    }
    #dropzone.hover .drop-icon { filter: none; }
    #dropzone p { font-size: 13px; color: var(--textdim); line-height: 1.7; }
    #dropzone strong { color: var(--accent); }

    /* ─── PREVIEW ─── */
    #preview-wrap { display: none; margin-top: 16px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
    #preview-wrap img { width: 100%; display: block; max-height: 260px; object-fit: contain; background: #000; }

    /* ─── ANALYZE BTN ─── */
    #analyzeBtn {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    #analyzeBtn:hover { opacity: .85; }
    #analyzeBtn:active { transform: scale(.98); }
    #analyzeBtn:disabled { opacity: .4; cursor: not-allowed; }

    /* ─── SPINNER ─── */
    .spinner { display:inline-block;width:14px;height:14px;border:2px solid #000;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ─── RESULT ─── */
    #result-card { display: none; }
    .verdict-box {
      padding: 20px 24px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .verdict-box.orginal { background: rgba(0,255,153,.07); border: 1px solid rgba(0,255,153,.25); }
    .verdict-box.app     { background: rgba(255,77,77,.07);  border: 1px solid rgba(255,77,77,.25); }
    .verdict-icon { font-size: 32px; }
    .verdict-label {
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
    }
    .verdict-box.orginal .verdict-label { color: var(--ok); }
    .verdict-box.app     .verdict-label { color: var(--warn); }
    .verdict-sub { font-size: 12px; color: var(--textdim); margin-top: 3px; }

    /* ─── METRICS ─── */
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .metric {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .metric-name { font-family: var(--font-mono); font-size: 10px; color: var(--textdim); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
    .metric-val  { font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
    .metric.flag-true  .metric-val { color: var(--warn); }
    .metric.flag-false .metric-val { color: var(--ok); }

    /* ─── VOTE BAR ─── */
    .vote-section { margin-top: 20px; }
    .vote-label { font-family: var(--font-mono); font-size: 11px; color: var(--textdim); letter-spacing: 2px; margin-bottom: 10px; }
    .vote-bar { height: 8px; background: var(--mute); border-radius: 4px; overflow: hidden; }
    .vote-fill { height: 100%; border-radius: 4px; transition: width .7s cubic-bezier(.4,0,.2,1); }
    .vote-count { font-family: var(--font-mono); font-size: 12px; margin-top: 6px; }

    /* ─── FLAGS ─── */
    .flags-grid { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 16px; }
    .flag-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .flag-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .flag-dot.t { background: var(--warn); }
    .flag-dot.f { background: var(--ok); }
    .flag-name { flex: 1; color: var(--textdim); }
    .flag-status { font-size: 11px; }
    .flag-status.t { color: var(--warn); }
    .flag-status.f { color: var(--ok); }

    /* ─── ERROR ─── */
    #error-msg { display: none; background: rgba(255,77,77,.08); border: 1px solid rgba(255,77,77,.25); border-radius: 8px; padding: 14px 18px; color: var(--warn); font-family: var(--font-mono); font-size: 13px; margin-top: 16px; }

    /* ─── RESET ─── */
    #resetBtn { display:none; width:100%; margin-top:14px; padding:10px; background:transparent; border:1px solid var(--border); border-radius:8px; color:var(--textdim); font-family:var(--font-mono); font-size:12px; cursor:pointer; transition:border-color .2s,color .2s; }
    #resetBtn:hover { border-color:var(--accent); color:var(--accent); }

    /* ─── FOOTER ─── */
    footer { text-align:center; padding:24px; font-family:var(--font-mono); font-size:11px; color:var(--mute); border-top:1px solid var(--border); }
  </style>
</head>
<body>

<header>
  <div class="logo">PK</div>
  <h1>PLAKA KİMLİK ANALİZÖRÜ</h1>
  <span>v2.0 — Paketaxi Filo</span>
</header>

<main>
  <!-- SOL: YÜKLEME -->
  <div class="card">
    <p class="card-title">// fotoğraf yükle</p>

    <div id="dropzone">
      <input type="file" id="fileInput" accept="image/*" />
      <div class="drop-icon">📷</div>
      <p>Fotoğrafı buraya sürükleyin<br>veya <strong>tıklayarak seçin</strong></p>
      <p style="margin-top:8px;font-size:11px;">JPG · PNG · WEBP · HEIC</p>
    </div>

    <div id="preview-wrap">
      <img id="preview" src="" alt="Önizleme" />
    </div>

    <button id="analyzeBtn">ANALİZ ET</button>
    <div id="error-msg"></div>
    <button id="resetBtn">↺ Yeni Fotoğraf</button>
  </div>

  <!-- SAĞ: SONUÇ -->
  <div class="card" id="result-card">
    <p class="card-title">// analiz sonucu</p>

    <div id="verdict-box" class="verdict-box">
      <span class="verdict-icon" id="verdict-icon"></span>
      <div>
        <div class="verdict-label" id="verdict-label">—</div>
        <div class="verdict-sub"  id="verdict-sub">—</div>
      </div>
    </div>

    <div class="metrics" id="metrics-grid"></div>

    <div class="vote-section">
      <p class="vote-label">// APP OY SKORU</p>
      <div class="vote-bar"><div class="vote-fill" id="vote-fill"></div></div>
      <p class="vote-count" id="vote-count"></p>
    </div>

    <div class="flags-grid" id="flags-grid"></div>
  </div>
</main>

<footer>Fotoğraf diske kaydedilmez · Sadece bellekte işlenir · Paketaxi © 2024</footer>

<script>
const dropzone   = document.getElementById("dropzone");
const fileInput  = document.getElementById("fileInput");
const preview    = document.getElementById("preview");
const previewW   = document.getElementById("preview-wrap");
const analyzeBtn = document.getElementById("analyzeBtn");
const errorMsg   = document.getElementById("error-msg");
const resetBtn   = document.getElementById("resetBtn");
const resultCard = document.getElementById("result-card");

let selectedFile = null;

/* ─── Sürükle-Bırak ─── */
dropzone.addEventListener("dragover",  e => { e.preventDefault(); dropzone.classList.add("hover"); });
dropzone.addEventListener("dragleave", ()=> dropzone.classList.remove("hover"));
dropzone.addEventListener("drop", e => {
  e.preventDefault(); dropzone.classList.remove("hover");
  const f = e.dataTransfer.files[0];
  if (f) loadFile(f);
});
fileInput.addEventListener("change", e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

function loadFile(f) {
  selectedFile = f;
  const url = URL.createObjectURL(f);
  preview.src = url;
  previewW.style.display = "block";
  analyzeBtn.style.display = "block";
  resetBtn.style.display = "block";
  errorMsg.style.display = "none";
  resultCard.style.display = "none";
}

/* ─── Analiz ─── */
analyzeBtn.addEventListener("click", async () => {
  if (!selectedFile) return;
  analyzeBtn.disabled = true;
  analyzeBtn.innerHTML = '<span class="spinner"></span>ANALİZ EDİLİYOR...';
  errorMsg.style.display = "none";
  resultCard.style.display = "none";

  const fd = new FormData();
  fd.append("file", selectedFile);

  try {
    const res  = await fetch("/analyze", { method: "POST", body: fd });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderResult(data);
  } catch(err) {
    errorMsg.textContent = "⚠ Hata: " + err.message;
    errorMsg.style.display = "block";
  } finally {
    analyzeBtn.disabled = false;
    analyzeBtn.innerHTML = "ANALİZ ET";
  }
});

/* ─── Sonuç Render ─── */
function renderResult(data) {
  const { result, details } = data;
  const isApp = result === "APP";

  const vBox   = document.getElementById("verdict-box");
  const vIcon  = document.getElementById("verdict-icon");
  const vLabel = document.getElementById("verdict-label");
  const vSub   = document.getElementById("verdict-sub");

  vBox.className = "verdict-box " + (isApp ? "app" : "orginal");
  vIcon.textContent  = isApp ? "🖥️" : "✅";
  vLabel.textContent = isApp ? "UYGULAMA EKRANI" : "ORİJİNAL PLAKA";
  vSub.textContent   = isApp
    ? "Bu plaka bir uygulamanın ekran görüntüsü gibi görünüyor."
    : "Bu plaka gerçek bir araç plakası olarak tespit edildi.";

  /* Metrikler */
  const metricsDefs = [
    { key:"laplacian_var",    label:"Keskinlik",     fmt: v => v.toFixed(1) },
    { key:"fft_std",          label:"FFT Skoru",     fmt: v => v.toFixed(2) },
    { key:"mono_ratio",       label:"Düz Renk",      fmt: v => (v*100).toFixed(1)+"%" },
    { key:"glare_ratio",      label:"Parlama",       fmt: v => (v*100).toFixed(1)+"%" },
    { key:"sensor_noise_std", label:"Sensör Gürültü",fmt: v => v.toFixed(2) },
    { key:"text_contrast",    label:"Metin Kontrast",fmt: v => v.toFixed(1) },
  ];
  const mg = document.getElementById("metrics-grid");
  mg.innerHTML = metricsDefs.map(m => `
    <div class="metric">
      <div class="metric-name">${m.label}</div>
      <div class="metric-val">${m.fmt(details[m.key] ?? 0)}</div>
    </div>
  `).join("");

  /* Oy Çubuğu */
  const votes = details.app_votes ?? 0;
  const total = 6;
  const pct   = (votes/total*100).toFixed(0);
  const fill  = document.getElementById("vote-fill");
  const vCount= document.getElementById("vote-count");
  fill.style.width      = "0%";
  fill.style.background = isApp ? "var(--warn)" : "var(--ok)";
  setTimeout(()=>{ fill.style.width = pct+"%"; }, 50);
  vCount.textContent = `${votes} / ${total} sinyal APP diyor  (${pct}%)`;

  /* Bayraklar */
  const flagLabels = {
    dusuk_keskinlik: "Düşük Keskinlik",
    duz_frekans:     "Düz Frekans",
    duz_renk:        "Düz Renk Alanı",
    ekran_parlamasi: "Ekran Parlaması",
    dusuk_gurultu:   "Düşük Sensör Gürültüsü",
    dusuk_kontrast:  "Düşük Metin Kontrast",
  };
  const fg = document.getElementById("flags-grid");
  fg.innerHTML = Object.entries(details.flags ?? {}).map(([k,v])=>`
    <div class="flag-row">
      <span class="flag-dot ${v?'t':'f'}"></span>
      <span class="flag-name">${flagLabels[k]||k}</span>
      <span class="flag-status ${v?'t':'f'}">${v ? "⚑ TETİKLENDİ" : "✓ TEMİZ"}</span>
    </div>
  `).join("");

  resultCard.style.display = "block";
}

/* ─── Reset ─── */
resetBtn.addEventListener("click", ()=>{
  selectedFile = null;
  fileInput.value = "";
  preview.src = "";
  previewW.style.display  = "none";
  analyzeBtn.style.display= "none";
  resetBtn.style.display  = "none";
  resultCard.style.display= "none";
  errorMsg.style.display  = "none";
});
</script>
</body>
</html>
