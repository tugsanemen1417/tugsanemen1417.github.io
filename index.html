    <main class="card">
        <!-- Upload Zone -->
        <div class="upload-zone" id="uploadZone">
            <div class="upload-icon">📸</div>
            <div class="upload-title">Plaka Fotoğrafı Yükle</div>
            <div class="upload-desc">Hologram ve mühür detaylarının net göründüğü fotoğraf</div>
            <div class="upload-specs">
                <span class="spec-badge">📁 Max 5MB</span>
                <span class="spec-badge">🖼️ JPG, PNG, WEBP</span>
                <span class="spec-badge">🔍 Min 800px</span>
            </div>
        </div>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp">

        <!-- Preview & Controls -->
        <div class="preview-section" id="previewSection">
            <div class="canvas-container">
                <canvas id="mainCanvas"></canvas>
            </div>

            <div class="controls">
                <div class="control-group">
                    <div class="control-label">
                        <span>🔧 Algılama Hassasiyeti</span>
                        <span class="control-value" id="sensitivityValue">0.3</span>
                    </div>
                    <input type="range" id="sensitivitySlider" min="0.1" max="0.9" step="0.05" value="0.3">
                    <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-top: 8px;">
                        <span>Katı (Daha seçici)</span>
                        <span>Toleranslı (Daha esnek)</span>
                    </div>
                </div>

                <div class="control-group">
                    <div class="control-label">
                        <span>🎨 Renk Toleransı</span>
                        <span class="control-value" id="colorValue">Orta</span>
                    </div>
                    <input type="range" id="colorSlider" min="10" max="100" step="5" value="40">
                </div>
            </div>

            <div style="display: flex; gap: 12px;">
                <button class="btn btn-secondary" onclick="removeImage()" style="flex: 0 0 auto; width: auto; padding: 12px 20px;">
                    🗑️ Kaldır
                </button>
                <button class="btn btn-primary" id="analyzeBtn" onclick="analyzePlate()" disabled>
                    <span>🔍</span> Analiz Et
                </button>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div style="color: var(--text-muted);">Görsel analiz ediliyor...</div>
        </div>

        <!-- Results -->
        <div class="results" id="results"></div>
    </main>
</div>

<!-- Toast -->
<div class="toast" id="toast">
    <span class="toast-icon">ℹ️</span>
    <span id="toastMessage">Mesaj</span>
</div>

<script>
    // State
    let originalImage = null;
    let processedImage = null;
    let canvas = document.getElementById('mainCanvas');
    let ctx = canvas.getContext('2d');
    let detectedRegion = null;
    let analysisData = null;

    // Elements
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const previewSection = document.getElementById('previewSection');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const sensitivitySlider = document.getElementById('sensitivitySlider');
    const colorSlider = document.getElementById('colorSlider');
    const sensitivityValue = document.getElementById('sensitivityValue');
    const colorValue = document.getElementById('colorValue');

    // Event Listeners
    uploadZone.addEventListener('click', () => fileInput.click());
    
    uploadZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadZone.classList.add('dragover');
    });
    
    uploadZone.addEventListener('dragleave', () => {
        uploadZone.classList.remove('dragover');
    });
    
    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) {
            handleFile(e.target.files[0]);
        }
    });

    sensitivitySlider.addEventListener('input', debounce((e) => {
        sensitivityValue.textContent = e.target.value;
        if (originalImage) {
            detectRegion();
            showToast('Hassasiyet güncellendi, bölge yeniden tespit edildi');
        }
    }, 300));

    colorSlider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        let text = val < 30 ? 'Düşük' : val < 60 ? 'Orta' : 'Yüksek';
        colorValue.textContent = text;
    });

    // Debounce helper
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }

    // Toast notification
    function showToast(message, icon = 'ℹ️') {
        const toast = document.getElementById('toast');
        document.getElementById('toastMessage').textContent = message;
        toast.querySelector('.toast-icon').textContent = icon;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // File Handler
    function handleFile(file) {
        if (!file.type.match(/image\/(jpeg|png|webp)/)) {
            showToast('Sadece JPG, PNG, WEBP formatları desteklenir', '❌');
            return;
        }

        if (file.size > 5 * 1024 * 1024) {
            showToast('Dosya boyutu 5MB\'ı geçemez', '❌');
            return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                originalImage = img;
                
                // Resize for performance (max 1200px width)
                const maxWidth = 1200;
                const scale = Math.min(1, maxWidth / img.width);
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                processedImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                // UI Update
                uploadZone.classList.add('hidden');
                previewSection.classList.add('active');
                analyzeBtn.disabled = false;
                
                // Auto detect region
                detectRegion();
                showToast('Fotoğraf yüklendi, plaka bölgesi tespit ediliyor...', '✅');
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // RGB to HSV conversion
    function rgbToHsv(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const diff = max - min;
        
        let h = 0;
        if (diff !== 0) {
            if (max === r) h = ((g - b) / diff + 6) % 6;
            else if (max === g) h = (b - r) / diff + 2;
            else h = (r - g) / diff + 4;
            h *= 60;
        }
        
        const s = max === 0 ? 0 : diff / max;
        const v = max;
        
        return { h, s: s * 100, v: v * 100 };
    }

    // Smart Region Detection
    function detectRegion() {
        if (!processedImage) return;
        
        const data = processedImage.data;
        const width = canvas.width;
        const height = canvas.height;
        const sensitivity = parseFloat(sensitivitySlider.value);
        
        // Clear canvas and redraw
        ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
        
        // Find plate region using multiple cues
        let bluePixels = [];
        let whitePixels = [];
        let darkPixels = [];
        
        // Sample every 4th pixel for performance
        for (let y = 0; y < height; y += 4) {
            for (let x = 0; x < width; x += 4) {
                const idx = (y * width + x) * 4;
                const r = data[idx], g = data[idx+1], b = data[idx+2];
                const hsv = rgbToHsv(r, g, b);
                
                // Blue detection (TR strip) - HSV
                // Blue hue: 200-260 degrees
                if ((hsv.h > 200 && hsv.h < 260) && hsv.s > 30 && hsv.v > 20) {
                    bluePixels.push({x, y, hsv});
                }
                
                // White detection (plate background)
                if (hsv.v > 70 && hsv.s < 20) {
                    whitePixels.push({x, y});
                }
                
                // Dark detection (characters/seal)
                if (hsv.v < 40) {
                    darkPixels.push({x, y});
                }
            }
        }
        
        // Calculate bounding box from blue pixels (left side)
        let minX = width, maxX = 0, minY = height, maxY = 0;
        
        if (bluePixels.length > 50) {
            bluePixels.forEach(p => {
                minX = Math.min(minX, p.x);
                maxX = Math.max(maxX, p.x);
                minY = Math.min(minY, p.y);
                maxY = Math.max(maxY, p.y);
            });
            
            // Expand to include full plate
            const blueWidth = maxX - minX;
            const plateWidth = Math.min(width - minX, blueWidth * 8); // Estimate plate width
            const plateHeight = Math.min(height - minY, (maxY - minY) * 3);
            
            detectedRegion = {
                x: Math.max(0, minX - 10),
                y: Math.max(0, minY - 10),
                width: Math.min(width - minX + 20, plateWidth),
                height: Math.min(height - minY + 20, plateHeight),
                blueCount: bluePixels.length,
                whiteCount: whitePixels.length,
                darkCount: darkPixels.length
            };
            
            // Draw detection box
            drawDetectionBox();
        } else {
            // Fallback: Use image center
            detectedRegion = {
                x: width * 0.1,
                y: height * 0.3,
                width: width * 0.8,
                height: height * 0.4,
                blueCount: 0,
                whiteCount: whitePixels.length,
                darkCount: darkPixels.length
            };
            drawDetectionBox();
            showToast('Mavi şerit tespit edilemedi, varsayılan bölge kullanılıyor', '⚠️');
        }
    }

    function drawDetectionBox() {
        if (!detectedRegion) return;
        
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 3;
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(detectedRegion.x, detectedRegion.y, detectedRegion.width, detectedRegion.height);
        ctx.setLineDash([]);
        
        // Label
        ctx.fillStyle = '#10b981';
        ctx.fillRect(detectedRegion.x, detectedRegion.y - 25, 140, 25);
        ctx.fillStyle = 'white';
        ctx.font = 'bold 12px Inter, sans-serif';
        ctx.fillText('PLAKA BÖLGESİ', detectedRegion.x + 8, detectedRegion.y - 8);
    }

    // Remove image
    function removeImage() {
        originalImage = null;
        processedImage = null;
        detectedRegion = null;
        fileInput.value = '';
        
        uploadZone.classList.remove('hidden');
        previewSection.classList.remove('active');
        analyzeBtn.disabled = true;
        document.getElementById('results').classList.remove('show');
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        showToast('Fotoğraf kaldırıldı', '🗑️');
    }

    // Main Analysis
    function analyzePlate() {
        if (!processedImage || !detectedRegion) return;
        
        document.getElementById('loading').classList.add('active');
        analyzeBtn.disabled = true;
        
        setTimeout(() => {
            performAnalysis();
            document.getElementById('loading').classList.remove('active');
            analyzeBtn.disabled = false;
        }, 500);
    }

    function performAnalysis() {
        const data = processedImage.data;
        const width = canvas.width;
        const height = canvas.height;
        const r = detectedRegion;
        const colorTolerance = parseInt(colorSlider.value);
        
        // Analysis metrics
        let metrics = {
            blueStrip: { score: 0, pixels: 0, total: 0 },
            whiteBg: { score: 0, pixels: 0, total: 0 },
            characters: { score: 0, pixels: 0, total: 0 },
            hologram: { score: 0, variance: 0 },
            seal: { score: 0, pixels: 0, total: 0 }
        };
        
        // 1. Blue Strip Analysis (Left side of region)
        const blueWidth = Math.min(r.width * 0.2, 80);
        for (let y = r.y; y < r.y + r.height; y += 2) {
            for (let x = r.x; x < r.x + blueWidth; x += 2) {
                const idx = (Math.floor(y) * width + Math.floor(x)) * 4;
                const hsv = rgbToHsv(data[idx], data[idx+1], data[idx+2]);
                
                metrics.blueStrip.total++;
                
                // Relaxed blue detection with tolerance
                if ((hsv.h > 200 - colorTolerance/2 && hsv.h < 260 + colorTolerance/2) && 
                    hsv.s > Math.max(20, 40 - colorTolerance/3) && 
                    hsv.v > 15) {
                    metrics.blueStrip.pixels++;
                }
            }
        }
        metrics.blueStrip.score = (metrics.blueStrip.pixels / metrics.blueStrip.total) * 100;
        
        // 2. White Background (Center-Right)
        const plateStartX = r.x + blueWidth;
        const plateWidth = r.width - blueWidth;
        
        for (let y = r.y; y < r.y + r.height; y += 3) {
            for (let x = plateStartX; x < plateStartX + plateWidth; x += 3) {
                const idx = (Math.floor(y) * width + Math.floor(x)) * 4;
                const hsv = rgbToHsv(data[idx], data[idx+1], data[idx+2]);
                
                metrics.whiteBg.total++;
                
                // White/Silver detection
                if (hsv.v > 60 && hsv.s < 30) {
                    metrics.whiteBg.pixels++;
                }
                
                // Dark characters
                if (hsv.v < 50) {
                    metrics.characters.pixels++;
                }
            }
        }
        metrics.whiteBg.score = (metrics.whiteBg.pixels / metrics.whiteBg.total) * 100;
        metrics.characters.score = Math.min(100, (metrics.characters.pixels / metrics.whiteBg.total) * 400);
        
        // 3. Hologram (Horizontal variance in center band)
        const centerY = r.y + r.height / 2;
        const bandHeight = r.height * 0.15;
        let prevLineAvg = 0;
        let varianceSum = 0;
        let lineCount = 0;
        
        for (let y = centerY - bandHeight/2; y < centerY + bandHeight/2; y += 4) {
            let lineSum = 0;
            let linePixels = 0;
            
            for (let x = plateStartX; x < plateStartX + plateWidth; x += 4) {
                const idx = (Math.floor(y) * width + Math.floor(x)) * 4;
                lineSum += (data[idx] + data[idx+1] + data[idx+2]) / 3;
                linePixels++;
            }
            
            const lineAvg = lineSum / linePixels;
            if (prevLineAvg > 0) {
                varianceSum += Math.abs(lineAvg - prevLineAvg);
                lineCount++;
            }
            prevLineAvg = lineAvg;
        }
        
        metrics.hologram.variance = lineCount > 0 ? varianceSum / lineCount : 0;
        metrics.hologram.score = Math.min(100, metrics.hologram.variance * 2);
        
        // 4. Seal (Top-left corner dark cluster)
        const sealSize = Math.min(r.width, r.height) * 0.25;
        for (let y = r.y; y < r.y + sealSize && y < r.y + r.height; y += 2) {
            for (let x = r.x; x < r.x + sealSize && x < r.x + r.width; x += 2) {
                const idx = (Math.floor(y) * width + Math.floor(x)) * 4;
                const hsv = rgbToHsv(data[idx], data[idx+1], data[idx+2]);
                
                metrics.seal.total++;
                
                // Dark circular pattern
                const distFromCorner = Math.sqrt(Math.pow(x - r.x, 2) + Math.pow(y - r.y, 2));
                if (distFromCorner < sealSize * 0.6 && hsv.v < 45) {
                    metrics.seal.pixels++;
                }
            }
        }
        metrics.seal.score = (metrics.seal.pixels / metrics.seal.total) * 100;
        
        // Calculate weighted total
        const weights = {
            blue: 25,
            white: 25,
            chars: 20,
            hologram: 15,
            seal: 15
        };
        
        const totalScore = 
            (Math.min(100, metrics.blueStrip.score * 1.2) * weights.blue / 100) +
            (Math.min(100, metrics.whiteBg.score * 1.1) * weights.white / 100) +
            (Math.min(100, metrics.characters.score) * weights.chars / 100) +
            (Math.min(100, metrics.hologram.score * 1.5) * weights.hologram / 100) +
            (Math.min(100, metrics.seal.score * 0.8) * weights.seal / 100);
        
        // Determine status
        let status, statusClass, title, message, badgeText;
        
        if (totalScore >= 70) {
            status = 'authentic';
            statusClass = 'result-authentic';
            title = 'ORİJİNAL PLAKA';
            message = 'Tüm güvenlik özellikleri başarıyla doğrulandı. Bu plaka TSE standartlarına uygundur.';
            badgeText = '✅ ONAYLANDI';
        } else if (totalScore >= 45) {
            status = 'suspicious';
            statusClass = 'result-suspicious';
            title = 'KONTROL GEREKLİ';
            message = 'Bazı özellikler yetersiz. Daha net bir fotoğraf çekmeyi deneyin veya manuel kontrol yapın.';
            badgeText = '⚠️ ŞÜPHELİ';
        } else {
            status = 'fake';
            statusClass = 'result-fake';
            title = 'STANDART DIŞI';
            message = 'Güvenlik özellikleri tespit edilemedi. Bu plaka sahte veya standart dışı olabilir.';
            badgeText = '❌ ONAYLANMADI';
        }
        
        // Render results
        const resultsDiv = document.getElementById('results');
        resultsDiv.classList.add('show');
        
        resultsDiv.innerHTML = `
            <div class="result-header ${statusClass}">
                <div class="result-badge">${badgeText}</div>
                <div class="score-display" style="color: ${status === 'authentic' ? '#4ade80' : status === 'suspicious' ? '#fbbf24' : '#fca5a5'}">
                    %${Math.round(totalScore)}
                </div>
                <div class="result-title">${title}</div>
                <div class="result-desc">${message}</div>
            </div>
            
            <div class="features-grid">
                ${renderFeatureCard('Mavi TR Şeridi', 'Sol taraftaki mavi şerit bölgesi', metrics.blueStrip.score, metrics.blueStrip.pixels, 'blue', '🔵')}
                ${renderFeatureCard('Beyaz/Gümüş Zemin', 'Plaka zemin rengi', metrics.whiteBg.score, metrics.whiteBg.pixels, 'white', '⬜')}
                ${renderFeatureCard('Siyah Karakterler', 'Plaka üzerindeki harf ve rakamlar', metrics.characters.score, metrics.characters.pixels, 'chars', '🔤')}
                ${renderFeatureCard('Hologram Şeridi', 'Orta kısımdaki dalgalı hologram', metrics.hologram.score, Math.round(metrics.hologram.variance), 'holo', '〰️')}
                ${renderFeatureCard('Mühür/Damga', 'Sol üst köşedeki TŞOF mührü', metrics.seal.score, metrics.seal.pixels, 'seal', '🔏')}
            </div>
        `;
        
        // Keep detection box visible
        drawDetectionBox();
    }

    function renderFeatureCard(title, desc, score, count, type, icon) {
        let status = score > 60 ? 'pass' : score > 30 ? 'warning' : 'fail';
        let statusText = score > 60 ? 'Tespit Edildi' : score > 30 ? 'Zayıf' : 'Bulunamadı';
        
        return `
            <div class="feature-card ${status}">
                <div class="feature-icon">${icon}</div>
                <div class="feature-content">
                    <div class="feature-title">${title}</div>
                    <div class="feature-desc">${desc} — ${statusText}</div>
                    <div class="feature-metrics">
                        <div class="metric">
                            <span class="metric-label">Güven</span>
                            <span class="metric-value" style="color: ${status === 'pass' ? '#4ade80' : status === 'warning' ? '#fbbf24' : '#fca5a5'}">${Math.round(score)}%</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Piksel</span>
                            <span class="metric-value">${count.toLocaleString()}</span>
                        </div>
                    </div>
                    <div class="confidence-bar">
                        <div class="confidence-fill" style="width: ${Math.min(100, score)}%"></div>
                    </div>
                </div>
            </div>
        `;
    }
</script>
</body>
</html>
