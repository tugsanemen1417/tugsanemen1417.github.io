<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plaka Forensik Analiz Pro v6.0 - Kesin Puanlama</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050508;
    --bg2: #0a0c10;
    --bg3: #111318;
    --amber: #f0a500;
    --amber-dim: #f0a50015;
    --red: #ff3a3a;
    --red-dim: #ff3a3a12;
    --green: #00e87a;
    --green-dim: #00e87a12;
    --cyan: #00d4ff;
    --cyan-dim: #00d4ff10;
    --text: #e8ecf1;
    --muted: #5a6270;
    --border: #1e232c;
    --border2: #2a303c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }

  header {
    padding: 32px 0 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--border2);
    margin-bottom: 36px;
    position: relative;
  }

  header::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, var(--amber), transparent);
  }

  .header-icon {
    width: 48px;
    height: 48px;
    background: var(--amber-dim);
    border: 1px solid var(--amber);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }

  .header-text h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: 3px;
    color: var(--amber);
  }

  .header-text p {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .status-badge {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--green-dim);
    border: 1px solid var(--green);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--green);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .upload-zone {
    border: 2px dashed var(--border2);
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    background: rgba(17, 19, 24, 0.5);
    min-height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }

  .upload-zone:hover {
    border-color: var(--amber);
    background: var(--amber-dim);
  }

  .upload-zone.has-image {
    padding: 10px;
    border-style: solid;
    border-color: var(--amber);
  }

  .upload-zone img {
    max-width: 100%;
    max-height: 300px;
    border-radius: 8px;
  }

  .upload-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.6; }
  .upload-title { font-weight: 600; font-size: 16px; margin-bottom: 6px; }
  .upload-sub { font-size: 13px; color: var(--muted); }

  #fileInput { display: none; }

  .btn-group {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .analyze-btn {
    flex: 1;
    padding: 14px;
    background: linear-gradient(135deg, var(--amber), #c78500);
    border: none;
    border-radius: 10px;
    color: #000;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.3s;
    font-weight: 700;
  }

  .analyze-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(240, 165, 0, 0.2);
  }

  .analyze-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .analyze-btn.analyzing {
    background: linear-gradient(135deg, var(--cyan), #0099cc);
    color: white;
  }

  .reset-btn {
    padding: 14px 24px;
    background: transparent;
    border: 1px solid var(--border2);
    border-radius: 10px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .reset-btn:hover { 
    border-color: var(--amber); 
    color: var(--amber);
    background: var(--amber-dim);
  }

  .log-panel {
    background: rgba(10, 12, 16, 0.6);
    border: 1px solid var(--border2);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .log-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: rgba(17, 19, 24, 0.8);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .log-area {
    background: rgba(5, 5, 8, 0.6);
    margin: 12px;
    border-radius: 10px;
    padding: 14px;
    height: 280px;
    overflow-y: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }

  .log-entry {
    display: flex;
    gap: 10px;
    margin-bottom: 6px;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .log-tag {
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    min-width: 45px;
    text-align: center;
  }
  .log-tag.info { background: var(--cyan-dim); color: var(--cyan); }
  .log-tag.pass { background: var(--green-dim); color: var(--green); }
  .log-tag.fail { background: var(--red-dim); color: var(--red); }
  .log-tag.warn { background: rgba(255, 153, 0, 0.1); color: #ff9900; }
  .log-tag.calc { background: rgba(240, 165, 0, 0.1); color: var(--amber); }

  .log-msg { flex: 1; color: var(--text); }
  .log-val { color: var(--amber); font-weight: 700; min-width: 50px; text-align: right; }

  .result-card {
    display: none;
    background: rgba(10, 12, 16, 0.8);
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border2);
    margin-bottom: 20px;
  }

  .result-card.visible { display: block; animation: slideUp 0.5s ease; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-banner {
    padding: 28px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .result-banner.original { background: linear-gradient(135deg, rgba(0, 232, 122, 0.08) 0%, transparent 60%); border-bottom: 1px solid rgba(0, 232, 122, 0.3); }
  .result-banner.fake { background: linear-gradient(135deg, rgba(255, 58, 58, 0.08) 0%, transparent 60%); border-bottom: 1px solid rgba(255, 58, 58, 0.3); }
  .result-banner.suspicious { background: linear-gradient(135deg, rgba(255, 153, 0, 0.08) 0%, transparent 60%); border-bottom: 1px solid rgba(255, 153, 0, 0.3); }

  .result-icon-big { font-size: 48px; flex-shrink: 0; }
  .result-info { flex: 1; }
  .result-info h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 3px;
    margin-bottom: 8px;
  }
  .result-info h2.green { color: var(--green); }
  .result-info h2.red { color: var(--red); }
  .result-info h2.orange { color: #ff9900; }

  .result-info p { font-size: 14px; color: var(--muted); }

  .score-circle {
    margin-left: auto;
    width: 100px;
    height: 100px;
    position: relative;
    flex-shrink: 0;
  }

  .score-circle svg {
    transform: rotate(-90deg);
    width: 100px;
    height: 100px;
  }

  .score-circle .track { fill: none; stroke: var(--border2); stroke-width: 8; }
  .score-circle .fill { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }

  .score-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
  }

  .score-num { font-size: 28px; font-weight: 700; line-height: 1; }
  .score-label { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-top: 4px; }

  .detail-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1px;
    background: var(--border);
  }

  @media (max-width: 768px) {
    .detail-grid { grid-template-columns: repeat(2, 1fr); }
    .result-banner { flex-direction: column; text-align: center; }
    .score-circle { margin: 20px auto 0; }
  }

  .detail-cell {
    background: rgba(17, 19, 24, 0.5);
    padding: 16px 10px;
    text-align: center;
  }

  .detail-cell-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
  .detail-cell-value { font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 700; }
  .detail-cell-sub { font-size: 10px; color: var(--muted); margin-top: 4px; opacity: 0.7; }

  .loading-spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .score-breakdown {
    margin: 0 12px 12px;
    padding: 12px;
    background: rgba(17, 19, 24, 0.5);
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .breakdown-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    text-align: center;
  }

  .breakdown-item {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .breakdown-item:last-child { border-bottom: none; }
  .breakdown-label { color: var(--muted); }
  .breakdown-val { color: var(--amber); font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .breakdown-weight { color: var(--cyan); font-size: 10px; }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-icon">🔍</div>
    <div class="header-text">
      <h1>PLATE FORENSICS PRO</h1>
      <p>Kesin Puanlama Sistemi v6.0</p>
    </div>
    <div class="status-badge">
      <div class="status-dot"></div>
      HAZIR
    </div>
  </header>

  <div class="upload-zone" id="uploadZone">
    <div class="upload-icon" id="uploadIcon">📷</div>
    <div class="upload-title" id="uploadTitle">Fotoğraf Seç veya Sürükle</div>
    <div class="upload-sub" id="uploadSub">JPG, PNG, WEBP — Max 20MB</div>
    <img id="previewImg" style="display:none;" />
  </div>
  <input type="file" id="fileInput" accept="image/*">

  <div class="btn-group">
    <button class="analyze-btn" id="analyzeBtn" disabled>
      🔬 ANALİZİ BAŞLAT
    </button>
    <button class="reset-btn" id="resetBtn" style="display:none;">
      ↺ SIFIRLA
    </button>
  </div>

  <div class="log-panel">
    <div class="log-header">
      📊 DETAYLI HESAPLAMA LOGU
    </div>
    <div class="log-area" id="logArea">
      <div style="color: var(--muted); text-align: center; padding: 40px; font-size: 12px;">
        Analiz başladığında tüm metrikler ve puanlamalar burada görünecek...
      </div>
    </div>
  </div>

  <div class="result-card" id="resultCard"></div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
const state = {
  imageData: null,
  logCount: 0,
  isAnalyzing: false
};

const elements = {
  fileInput: document.getElementById('fileInput'),
  uploadZone: document.getElementById('uploadZone'),
  previewImg: document.getElementById('previewImg'),
  uploadIcon: document.getElementById('uploadIcon'),
  uploadTitle: document.getElementById('uploadTitle'),
  uploadSub: document.getElementById('uploadSub'),
  analyzeBtn: document.getElementById('analyzeBtn'),
  resetBtn: document.getElementById('resetBtn'),
  logArea: document.getElementById('logArea'),
  resultCard: document.getElementById('resultCard'),
  canvas: document.getElementById('canvas')
};

function addLog(tag, msg, value = '') {
  const area = elements.logArea;
  if (state.logCount === 0) area.innerHTML = '';
  
  state.logCount++;
  
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `
    <span class="log-tag ${tag}">${tag.toUpperCase()}</span>
    <span class="log-msg">${msg}</span>
    ${value ? `<span class="log-val">${value}</span>` : ''}
  `;
  
  area.appendChild(entry);
  area.scrollTop = area.scrollHeight;
}

function handleFile(file) {
  if (!file) return;
  
  if (!['image/jpeg', 'image/png', 'image/webp', 'image/jpg'].includes(file.type)) {
    addLog('fail', 'Desteklenmeyen format');
    return;
  }
  
  if (file.size > 20 * 1024 * 1024) {
    addLog('fail', 'Dosya çok büyük (Max: 20MB)');
    return;
  }

  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      elements.previewImg.src = ev.target.result;
      elements.previewImg.style.display = 'block';
      elements.uploadIcon.style.display = 'none';
      elements.uploadTitle.style.display = 'none';
      elements.uploadSub.style.display = 'none';
      elements.uploadZone.classList.add('has-image');
      elements.analyzeBtn.disabled = false;
      elements.resetBtn.style.display = 'block';
      state.imageData = ev.target.result;
      
      elements.logArea.innerHTML = '';
      addLog('info', `Görüntü yüklendi: ${file.name}`);
      addLog('info', `Boyut: ${img.width}×${img.height}px`);
      
      elements.resultCard.className = 'result-card';
      state.logCount = 0;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function resetAll() {
  state.imageData = null;
  state.logCount = 0;
  state.isAnalyzing = false;
  
  elements.fileInput.value = '';
  elements.previewImg.style.display = 'none';
  elements.previewImg.src = '';
  elements.uploadIcon.style.display = 'block';
  elements.uploadTitle.style.display = 'block';
  elements.uploadSub.style.display = 'block';
  elements.uploadZone.classList.remove('has-image');
  elements.analyzeBtn.disabled = true;
  elements.analyzeBtn.textContent = '🔬 ANALİZİ BAŞLAT';
  elements.analyzeBtn.classList.remove('analyzing');
  elements.resetBtn.style.display = 'none';
  
  elements.logArea.innerHTML = '<div style="color: var(--muted); text-align: center; padding: 40px; font-size: 12px;">Analiz başladığında tüm metrikler ve puanlamalar burada görünecek...</div>';
  elements.resultCard.className = 'result-card';
}

// ==================== KESİN PUANLAMA SİSTEMİ ====================
class PrecisePlateAnalyzer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { willReadFrequently: true });
    this.width = 0;
    this.height = 0;
    this.gray = null;
    this.scores = {};
  }

  async loadImage(src) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth;
        let h = img.naturalHeight;
        const maxDim = 800; // Hız için küçült
        
        if (w > maxDim || h > maxDim) {
          const ratio = Math.min(maxDim / w, maxDim / h);
          w = Math.floor(w * ratio);
          h = Math.floor(h * ratio);
        }
        
        this.canvas.width = w;
        this.canvas.height = h;
        this.ctx.drawImage(img, 0, 0, w, h);
        
        this.width = w;
        this.height = h;
        this.extractGray();
        
        resolve({ width: w, height: h });
      };
      img.src = src;
    });
  }

  extractGray() {
    const imgData = this.ctx.getImageData(0, 0, this.width, this.height);
    const data = imgData.data;
    this.gray = new Float32Array(this.width * this.height);
    
    for (let i = 0; i < data.length; i += 4) {
      // Rec. 709 katsayıları
      this.gray[i / 4] = 0.2126 * data[i] + 0.7152 * data[i + 1] + 0.0722 * data[i + 2];
    }
  }

  analyze() {
    // 1. BEYAZ ZEMİN SKORU (25% ağırlık)
    // Plaka beyazdır ama parlaklık farklı olabilir
    this.scores.white = this.calculateWhiteScore();
    addLog('calc', 'Beyaz Zemin Analizi (Hedef: %40-70)', `${this.scores.white.score}/100`);
    
    // 2. SİYAH KARAKTER SKORU (20% ağırlık)
    // Karakterler koyu renkli olmalı
    this.scores.black = this.calculateBlackScore();
    addLog('calc', 'Siyah Karakter Analizi (Hedef: %15-35)', `${this.scores.black.score}/100`);
    
    // 3. KONTRAST SKORU (20% ağırlık)
    // Kenarlar keskin olmalı
    this.scores.contrast = this.calculateContrastScore();
    addLog('calc', 'Kontrast/Keskinlik Analizi', `${this.scores.contrast.score}/100`);
    
    // 4. GEOMETRİK DÜZEN (15% ağırlık)
    // Dikdörtgen form ve düzenli yapı
    this.scores.geometry = this.calculateGeometryScore();
    addLog('calc', 'Geometrik Düzen Analizi', `${this.scores.geometry.score}/100`);
    
    // 5. KARAKTER YAPISI (10% ağırlık)
    // Düzenli satırlar ve boşluklar
    this.scores.structure = this.calculateStructureScore();
    addLog('calc', 'Karakter Yapısı Analizi', `${this.scores.structure.score}/100`);
    
    // 6. ENTROPY/SAHTECİLİK (10% ağırlık)
    // Doğal görüntü kontrolü
    this.scores.entropy = this.calculateEntropyScore();
    addLog('calc', 'Entropy/Sahtecilik Kontrolü', `${this.scores.entropy.score}/100`);
    
    // AĞIRLIKLI TOPLAM SKOR
    const finalScore = (
      this.scores.white.score * 0.25 +
      this.scores.black.score * 0.20 +
      this.scores.contrast.score * 0.20 +
      this.scores.geometry.score * 0.15 +
      this.scores.structure.score * 0.10 +
      this.scores.entropy.score * 0.10
    );
    
    return Math.round(finalScore);
  }

  calculateWhiteScore() {
    let lightPixels = 0;
    const threshold = 120; // Beyaz zemin threshold
    
    for (const val of this.gray) {
      if (val > threshold && val < 240) lightPixels++; // Çok parlak değil (doğal ışık)
    }
    
    const ratio = lightPixels / this.gray.length;
    // İdeal: %50-70 beyaz (plaka zemin)
    // Skor: 0-100 arası Gauss eğrisi
    const ideal = 0.60;
    const deviation = Math.abs(ratio - ideal);
    const score = Math.max(0, 100 - (deviation * 200)); // Her %0.5 sapma = -100 puan
    
    return { score: Math.round(score), ratio: (ratio * 100).toFixed(1) };
  }

  calculateBlackScore() {
    let darkPixels = 0;
    const threshold = 80; // Siyah karakter threshold
    
    for (const val of this.gray) {
      if (val < threshold) darkPixels++;
    }
    
    const ratio = darkPixels / this.gray.length;
    // İdeal: %20-30 siyah (karakterler)
    const ideal = 0.25;
    const deviation = Math.abs(ratio - ideal);
    const score = Math.max(0, 100 - (deviation * 300));
    
    return { score: Math.round(score), ratio: (ratio * 100).toFixed(1) };
  }

  calculateContrastScore() {
    // Laplacian variance (kenar keskinliği)
    let laplacianSum = 0;
    let count = 0;
    
    for (let y = 1; y < this.height - 1; y++) {
      for (let x = 1; x < this.width - 1; x++) {
        const idx = y * this.width + x;
        const center = this.gray[idx];
        const laplacian = 
          4 * center - 
          this.gray[idx - 1] - 
          this.gray[idx + 1] - 
          this.gray[idx - this.width] - 
          this.gray[idx + this.width];
        
        laplacianSum += laplacian * laplacian;
        count++;
      }
    }
    
    const variance = laplacianSum / count;
    // İdeal variance: 500-2000 arası
    const score = Math.min(100, Math.max(0, (variance - 100) / 15));
    
    return { score: Math.round(score), variance: Math.round(variance) };
  }

  calculateGeometryScore() {
    // Görüntünün ortasında yoğunluk kontrolü (plaka genelde ortadadır)
    const cx = Math.floor(this.width / 2);
    const cy = Math.floor(this.height / 2);
    const w = Math.floor(this.width * 0.6);
    const h = Math.floor(this.height * 0.3);
    
    let centerEdgeCount = 0;
    
    for (let y = cy - h/2; y < cy + h/2; y++) {
      for (let x = cx - w/2; x < cx + w/2; x++) {
        if (x < 1 || x >= this.width - 1 || y < 1 || y >= this.height - 1) continue;
        
        const idx = Math.floor(y * this.width + x);
        const gx = this.gray[idx + 1] - this.gray[idx - 1];
        const gy = this.gray[idx + this.width] - this.gray[idx - this.width];
        const magnitude = Math.sqrt(gx*gx + gy*gy);
        
        if (magnitude > 50) centerEdgeCount++;
      }
    }
    
    const totalPixels = w * h;
    const edgeDensity = centerEdgeCount / totalPixels;
    // İdeal edge yoğunluğu: %5-15 arası
    const score = edgeDensity > 0.02 && edgeDensity < 0.25 ? 
      100 - Math.abs(edgeDensity - 0.10) * 400 : Math.max(0, 100 - Math.abs(edgeDensity - 0.10) * 800);
    
    return { score: Math.round(score), density: (edgeDensity * 100).toFixed(1) };
  }

  calculateStructureScore() {
    // Yatal projeksiyon (karakter satırları)
    const midY = Math.floor(this.height / 2);
    const range = Math.floor(this.height * 0.2);
    const rowSum = [];
    
    for (let y = midY - range; y < midY + range; y++) {
      if (y < 0 || y >= this.height) continue;
      let sum = 0;
      for (let x = 0; x < this.width; x++) {
        if (this.gray[y * this.width + x] < 100) sum++;
      }
      rowSum.push(sum);
    }
    
    // Pik tespiti (karakter satırları)
    let peaks = 0;
    let inPeak = false;
    for (const val of rowSum) {
      const density = val / this.width;
      if (density > 0.1 && !inPeak) {
        peaks++;
        inPeak = true;
      } else if (density < 0.05) {
        inPeak = false;
      }
    }
    
    // 1-3 satır ideal
    const score = peaks >= 1 && peaks <= 3 ? 100 - Math.abs(peaks - 2) * 20 : Math.max(0, 60 - peaks * 10);
    
    return { score: Math.round(score), lines: peaks };
  }

  calculateEntropyScore() {
    // Shannon Entropy
    const hist = new Array(256).fill(0);
    for (const val of this.gray) {
      hist[Math.floor(val)]++;
    }
    
    let entropy = 0;
    const total = this.gray.length;
    
    for (let i = 0; i < 256; i++) {
      if (hist[i] > 0) {
        const p = hist[i] / total;
        entropy -= p * Math.log2(p);
      }
    }
    
    // İdeal entropy: 5-7 arası (doğal görüntü)
    // Düşük entropy = sahte/kopya (düzenli desenler)
    // Yüksek entropy = gürültülü
    let score = 100;
    if (entropy < 4) score = entropy * 25; // Düşük = sahte
    else if (entropy > 7.5) score = Math.max(0, 100 - (entropy - 7.5) * 20); // Çok yüksek = gürültü
    else score = 100; // İdeal aralık
    
    return { score: Math.round(score), entropy: entropy.toFixed(2) };
  }

  getBreakdown() {
    return this.scores;
  }
}

async function startAnalysis() {
  if (!state.imageData || state.isAnalyzing) return;
  
  state.isAnalyzing = true;
  const btn = elements.analyzeBtn;
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner"></span> HESAPLANIYOR...';
  btn.classList.add('analyzing');
  
  elements.resultCard.className = 'result-card';
  state.logCount = 0;
  elements.logArea.innerHTML = '';

  try {
    addLog('info', 'Kesin Puanlama Sistemi v6.0 başlatıldı');
    addLog('info', '6 Kriter üzerinden ağırlıklı hesaplama yapılıyor...');
    addLog('pass', '----------------------------------------');
    
    const analyzer = new PrecisePlateAnalyzer(elements.canvas);
    
    addLog('info', 'Görüntü yükleniyor...');
    const { width, height } = await analyzer.loadImage(state.imageData);
    addLog('pass', `İşlem boyutu: ${width}×${height}px`);
    addLog('info', '');
    
    addLog('calc', '>>> DETAYLI HESAPLAMA BAŞLIYOR <<<');
    
    const finalScore = analyzer.analyze();
    const breakdown = analyzer.getBreakdown();
    
    addLog('info', '');
    addLog('calc', '----------------------------------------');
    addLog('calc', `SONUÇ: Beyaz(×0.25) + Siyah(×0.20) + Kontrast(×0.20) + Geometri(×0.15) + Yapı(×0.10) + Entropy(×0.10)`);
    addLog('pass', `FINAL SKOR: ${finalScore}/100`);
    addLog('calc', '----------------------------------------');
    
    // KESİN KARAR
    let verdict, type, icon;
    
    if (finalScore >= 75) {
      verdict = 'ORİJİNAL PLAKA';
      type = 'original';
      icon = '✅';
    } else if (finalScore >= 45) {
      verdict = 'KUŞKULU PLAKA';
      type = 'suspicious';
      icon = '⚠️';
    } else {
      verdict = 'SAHTE/GEÇERSİZ';
      type = 'fake';
      icon = '🚨';
    }
    
    showResult(verdict, type, icon, finalScore, breakdown, width, height);
    
  } catch (error) {
    console.error(error);
    addLog('fail', `Sistem Hatası: ${error.message}`);
  } finally {
    state.isAnalyzing = false;
    btn.disabled = false;
    btn.textContent = '🔬 ANALİZİ BAŞLAT';
    btn.classList.remove('analyzing');
  }
}

function showResult(verdict, type, icon, score, breakdown, w, h) {
  const card = elements.resultCard;
  const circ = 2 * Math.PI * 40;
  const color = type === 'original' ? '#00e87a' : type === 'fake' ? '#ff3a3a' : '#ff9900';
  
  // Detaylı hesaplama gösterimi
  const calcDetails = `
    <div class="score-breakdown">
      <div class="breakdown-title">🧮 Hesaplama Detayları (Ağırlıklı Ortalama)</div>
      <div class="breakdown-item">
        <span class="breakdown-label">Beyaz Zemin (Hedef: %50-70) <span class="breakdown-weight">×0.25</span></span>
        <span class="breakdown-val">${breakdown.white.score} × 0.25 = ${Math.round(breakdown.white.score * 0.25)}</span>
      </div>
      <div class="breakdown-item">
        <span class="breakdown-label">Siyah Karakter (Hedef: %20-30) <span class="breakdown-weight">×0.20</span></span>
        <span class="breakdown-val">${breakdown.black.score} × 0.20 = ${Math.round(breakdown.black.score * 0.20)}</span>
      </div>
      <div class="breakdown-item">
        <span class="breakdown-label">Kontrast (Kenar Keskinliği) <span class="breakdown-weight">×0.20</span></span>
        <span class="breakdown-val">${breakdown.contrast.score} × 0.20 = ${Math.round(breakdown.contrast.score * 0.20)}</span>
      </div>
      <div class="breakdown-item">
        <span class="breakdown-label">Geometrik Düzen (Ortalama Yoğunluk) <span class="breakdown-weight">×0.15</span></span>
        <span class="breakdown-val">${breakdown.geometry.score} × 0.15 = ${Math.round(breakdown.geometry.score * 0.15)}</span>
      </div>
      <div class="breakdown-item">
        <span class="breakdown-label">Karakter Yapısı (Satır Sayısı) <span class="breakdown-weight">×0.10</span></span>
        <span class="breakdown-val">${breakdown.structure.score} × 0.10 = ${Math.round(breakdown.structure.score * 0.10)}</span>
      </div>
      <div class="breakdown-item">
        <span class="breakdown-label">Entropy (Doğallık) <span class="breakdown-weight">×0.10</span></span>
        <span class="breakdown-val">${breakdown.entropy.score} × 0.10 = ${Math.round(breakdown.entropy.score * 0.10)}</span>
      </div>
      <div class="breakdown-item" style="border-top: 1px solid var(--border); margin-top: 8px; padding-top: 8px;">
        <span class="breakdown-label" style="color: var(--text); font-weight: 700;">TOPLAM SKOR</span>
        <span class="breakdown-val" style="color: var(--green); font-size: 14px;">${score}/100</span>
      </div>
    </div>
  `;
  
  card.innerHTML = `
    <div class="result-banner ${type}">
      <div class="result-icon-big">${icon}</div>
      <div class="result-info">
        <h2 class="${type === 'original' ? 'green' : type === 'fake' ? 'red' : 'orange'}">${verdict}</h2>
        <p>${type === 'original' ? 'Tüm kriterler orijinal plaka profiline uyuyor.' : 
            type === 'fake' ? 'Plaka standartlarına uymayan sapmalar tespit edildi.' : 
            'Bazı kriterler belirsiz, manuel kontrol önerilir.'}</p>
      </div>
      <div class="score-circle">
        <svg viewBox="0 0 90 90">
          <circle class="track" cx="45" cy="45" r="40"/>
          <circle class="fill" cx="45" cy="45" r="40" stroke="${color}" stroke-dasharray="${circ}" stroke-dashoffset="${circ - (score/100)*circ}"/>
        </svg>
        <div class="score-text">
          <span class="score-num" style="color:${color}">${score}</span>
          <span class="score-label">SKOR</span>
        </div>
      </div>
    </div>
    ${calcDetails}
    <div class="detail-grid">
      <div class="detail-cell">
        <div class="detail-cell-label">Görüntü Boyutu</div>
        <div class="detail-cell-value" style="color: var(--cyan)">${w}×${h}</div>
      </div>
      <div class="detail-cell">
        <div class="detail-cell-label">Beyaz Oranı</div>
        <div class="detail-cell-value" style="color:${breakdown.white.score > 70 ? 'var(--green)' : 'var(--red)'}">${breakdown.white.ratio}%</div>
        <div class="detail-cell-sub">Hedef: 50-70%</div>
      </div>
      <div class="detail-cell">
        <div class="detail-cell-label">Siyah Oranı</div>
        <div class="detail-cell-value" style="color:${breakdown.black.score > 70 ? 'var(--green)' : 'var(--red)'}">${breakdown.black.ratio}%</div>
        <div class="detail-cell-sub">Hedef: 20-30%</div>
      </div>
      <div class="detail-cell">
        <div class="detail-cell-label">Kontrast</div>
        <div class="detail-cell-value" style="color:${breakdown.contrast.score > 70 ? 'var(--green)' : 'var(--amber)'}">${breakdown.contrast.variance}</div>
        <div class="detail-cell-sub">Değişim</div>
      </div>
      <div class="detail-cell">
        <div class="detail-cell-label">Karakter Satırı</div>
        <div class="detail-cell-value" style="color:${breakdown.structure.lines >= 1 && breakdown.structure.lines <= 3 ? 'var(--green)' : 'var(--red)'}">${breakdown.structure.lines}</div>
        <div class="detail-cell-sub">Tespit</div>
      </div>
      <div class="detail-cell">
        <div class="detail-cell-label">Entropy</div>
        <div class="detail-cell-value" style="color:${breakdown.entropy.entropy > 4 && breakdown.entropy.entropy < 7.5 ? 'var(--green)' : 'var(--red)'}">${breakdown.entropy.entropy}</div>
        <div class="detail-cell-sub">Doğallık</div>
      </div>
    </div>
  `;
  
  card.className = 'result-card visible';
  card.scrollIntoView({ behavior: 'smooth' });
}

// Events
elements.uploadZone.addEventListener('click', () => {
  if (!state.isAnalyzing) elements.fileInput.click();
});

elements.fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) handleFile(file);
});

elements.analyzeBtn.addEventListener('click', startAnalysis);
elements.resetBtn.addEventListener('click', resetAll);

elements.uploadZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  elements.uploadZone.classList.add('drag-over');
});

elements.uploadZone.addEventListener('dragleave', () => {
  elements.uploadZone.classList.remove('drag-over');
});

elements.uploadZone.addEventListener('drop', (e) => {
  e.preventDefault();
  elements.uploadZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) handleFile(file);
});
</script>
</body>
</html>
