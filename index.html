<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TR Plaka Kontrol - Akıllı Bölge Tespiti</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }
        
        .container { max-width: 800px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 30px; }
        
        h1 { font-size: 28px; margin-bottom: 10px; }
        
        .subtitle { color: #94a3b8; font-size: 14px; }
        
        .card {
            background: rgba(30, 41, 59, 0.9);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
        }
        
        .upload-area {
            border: 3px dashed rgba(245, 158, 11, 0.4);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(245, 158, 11, 0.05);
            margin-bottom: 20px;
        }
        
        .upload-area:hover { border-color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
        .upload-area.has-image { display: none; }
        
        .file-input { display: none; }
        
        .preview-section {
            display: none;
            margin-bottom: 20px;
        }
        
        .preview-section.show { display: block; }
        
        .preview-wrapper {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .preview-image {
            width: 100%;
            display: block;
        }
        
        .region-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .detected-region {
            position: absolute;
            border: 3px solid #10b981;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 4px;
        }
        
        .region-label {
            position: absolute;
            top: -25px;
            left: 0;
            background: #10b981;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .file-info {
            margin-top: 15px;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .remove-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .btn {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }
        
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .loading.show { display: block; }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #f59e0b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .result {
            display: none;
            margin-top: 24px;
        }
        
        .result.show { display: block; animation: slideUp 0.4s ease; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-header {
            text-align: center;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        
        .result-original { background: linear-gradient(135deg, rgba(5, 150, 105, 0.2), rgba(16, 185, 129, 0.2)); border: 2px solid #10b981; }
        .result-suspicious { background: linear-gradient(135deg, rgba(217, 119, 6, 0.2), rgba(245, 158, 11, 0.2)); border: 2px solid #f59e0b; }
        .result-fake { background: linear-gradient(135deg, rgba(220, 38, 38, 0.2), rgba(239, 68, 68, 0.2)); border: 2px solid #ef4444; }
        
        .authenticity-score { font-size: 64px; font-weight: 800; margin: 15px 0; }
        
        .features-grid {
            display: grid;
            gap: 12px;
        }
        
        .feature-card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border-left: 4px solid;
            transition: all 0.3s;
        }
        
        .feature-card.pass { border-left-color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .feature-card.fail { border-left-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .feature-card.warning { border-left-color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
        
        .feature-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: rgba(255,255,255,0.1);
            flex-shrink: 0;
        }
        
        .feature-card.pass .feature-icon { background: #10b981; }
        .feature-card.fail .feature-icon { background: #ef4444; }
        .feature-card.warning .feature-icon { background: #f59e0b; }
        
        .feature-content { flex: 1; }
        
        .feature-title { font-weight: 700; font-size: 16px; margin-bottom: 6px; }
        
        .feature-desc { font-size: 13px; color: #94a3b8; line-height: 1.5; }
        
        .detail-values {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            font-size: 12px;
        }
        
        .detail-value {
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 6px;
        }
        
        .detail-label { color: #64748b; margin-right: 6px; }
        
        .detail-number { color: white; font-weight: 600; }
        
        .error-message {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            color: #fca5a5;
            font-size: 13px;
        }
        
        .error-message.show { display: block; }
        
        .debug-panel {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            font-size: 11px;
            font-family: monospace;
            color: #94a3b8;
            display: none;
        }
        
        .debug-panel.show { display: block; }
        
        .threshold-slider {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
        }
        
        .threshold-slider label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        
        .threshold-slider input[type="range"] {
            width: 100%;
            margin-bottom: 10px;
        }
        
        .threshold-value {
            text-align: center;
            font-weight: 600;
            color: #f59e0b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚗 TR Plaka Kontrol</h1>
            <p class="subtitle">Akıllı bölge tespiti ile otomatik analiz</p>
        </div>
        
        <div class="card">
            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <div style="font-size: 48px; margin-bottom: 15px;">📸</div>
                <div style="font-weight: 600; font-size: 18px; margin-bottom: 8px;">Plaka Fotoğrafı Yükle</div>
                <div style="color: #94a3b8; font-size: 13px;">Otomatik bölge tespiti yapılacak</div>
                <input type="file" id="fileInput" class="file-input" accept="image/jpeg,image/png,image/webp">
            </div>
            
            <div class="preview-section" id="previewSection">
                <div class="preview-wrapper">
                    <img id="previewImage" class="preview-image">
                    <div class="region-overlay" id="regionOverlay"></div>
                </div>
                <div class="file-info">
                    <div>
                        <div id="fileName" style="font-weight: 600;"></div>
                        <div id="fileDetails" style="font-size: 12px; color: #94a3b8; margin-top: 4px;"></div>
                    </div>
                    <button class="remove-btn" onclick="removeImage()">🗑️ Kaldır</button>
                </div>
                
                <!-- Hassasiyet Ayarı -->
                <div class="threshold-slider">
                    <label>🔧 Algılama Hassasiyeti (Düşük değer = Daha katı, Yüksek değer = Daha toleranslı)</label>
                    <input type="range" id="sensitivitySlider" min="0.1" max="0.9" step="0.1" value="0.3">
                    <div class="threshold-value" id="sensitivityValue">0.3 (Standart)</div>
                </div>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div style="color: #94a3b8;">Akıllı analiz yapılıyor...</div>
            </div>
            
            <button class="btn btn-primary" id="analyzeBtn" onclick="analyzePlate()" disabled>
                <span>🔍</span> Plakayı Analiz Et
            </button>
            
            <div class="result" id="result"></div>
            <div class="debug-panel" id="debugPanel"></div>
        </div>
    </div>

    <script>
        let currentImage = null;
        let detectedRegions = null;
        
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const previewImage = document.getElementById('previewImage');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const sensitivitySlider = document.getElementById('sensitivitySlider');
        const sensitivityValue = document.getElementById('sensitivityValue');
        
        // Hassasiyet değişimi
        sensitivitySlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            let text = val <= 0.2 ? 'Çok Katı' : val <= 0.4 ? 'Standart' : val <= 0.6 ? 'Toleranslı' : 'Çok Toleranslı';
            sensitivityValue.textContent = `${val} (${text})`;
        });
        
        fileInput.addEventListener('change', handleFileSelect);
        
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            hideError();
            
            if (!file.type.match(/image\/(jpeg|png|webp)/)) {
                showError('❌ Sadece JPG, PNG veya WEBP formatları desteklenir.');
                return;
            }
            
            if (file.size > 5 * 1024 * 1024) {
                showError('❌ Dosya boyutu 5MB\'ı geçemez.');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (e) => {
                currentImage = e.target.result;
                previewImage.src = currentImage;
                previewImage.onload = () => {
                    document.getElementById('fileName').textContent = file.name;
                    document.getElementById('fileDetails').textContent = 
                        `${(file.size/1024).toFixed(1)} KB • ${previewImage.naturalWidth}x${previewImage.naturalHeight}px`;
                    
                    uploadArea.classList.add('has-image');
                    previewSection.classList.add('show');
                    analyzeBtn.disabled = false;
                    
                    // Otomatik bölge tespiti
                    detectPlateRegion();
                };
            };
            reader.readAsDataURL(file);
        }
        
        function removeImage() {
            currentImage = null;
            fileInput.value = '';
            uploadArea.classList.remove('has-image');
            previewSection.classList.remove('show');
            analyzeBtn.disabled = true;
            document.getElementById('result').classList.remove('show');
            document.getElementById('regionOverlay').innerHTML = '';
            hideError();
        }
        
        function showError(msg) {
            const err = document.getElementById('errorMessage');
            err.innerHTML = msg;
            err.classList.add('show');
        }
        
        function hideError() {
            document.getElementById('errorMessage').classList.remove('show');
        }
        
        function logDebug(msg) {
            const panel = document.getElementById('debugPanel');
            panel.classList.add('show');
            panel.innerHTML += msg + '<br>';
        }
        
        // AKILLI PLAKA BÖLGE TESPİTİ
        function detectPlateRegion() {
            const img = previewImage;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Küçük boyutlu analiz için ölçekle (performans)
            const scale = Math.min(1, 800 / img.naturalWidth);
            canvas.width = img.naturalWidth * scale;
            canvas.height = img.naturalHeight * scale;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const width = canvas.width;
            const height = canvas.height;
            
            const sensitivity = parseFloat(sensitivitySlider.value);
            
            // 1. BEYAZ BÖLGE TESPİTİ (Plaka zemin)
            // Yatay tarama - beyaz piksel yoğunluğu
            let whiteBands = [];
            
            for (let y = 0; y < height; y += 2) {
                let whiteCount = 0;
                let totalBrightness = 0;
                
                for (let x = 0; x < width; x += 2) {
                    const idx = (y * width + x) * 4;
                    const r = data[idx], g = data[idx+1], b = data[idx+2];
                    const brightness = (r + g + b) / 3;
                    
                    totalBrightness += brightness;
                    
                    // Beyaz: Yüksek parlaklık + dengeli RGB
                    if (brightness > 150 && r > 140 && g > 140 && b > 140 && 
                        Math.abs(r-g) < 30 && Math.abs(r-b) < 30 && Math.abs(g-b) < 30) {
                        whiteCount++;
                    }
                }
                
                const bandWidth = Math.ceil(width / 2);
                const whiteRatio = whiteCount / bandWidth;
                const avgBrightness = totalBrightness / bandWidth;
                
                // Beyaz bant tespiti
                if (whiteRatio > (0.3 - sensitivity * 0.2) && avgBrightness > 120) {
                    whiteBands.push({y, whiteRatio, avgBrightness});
                }
            }
            
            // 2. MAVİ ŞERİDİ TESPİTİ (Sol taraf)
            let blueRegions = [];
            
            for (let x = 0; x < width * 0.3; x += 2) {
                for (let y = 0; y < height; y += 2) {
                    const idx = (y * width + x) * 4;
                    const r = data[idx], g = data[idx+1], b = data[idx+2];
                    
                    // Mavi: B yüksek, R ve G düşük/orta
                    if (b > r + 30 && b > g + 15 && b > 80) {
                        blueRegions.push({x, y, b, r, g});
                    }
                }
            }
            
            // 3. KARAKTER BÖLGESİ (Siyah/dark pikseller)
            let charRegions = [];
            
            for (let y = 0; y < height; y += 3) {
                for (let x = width * 0.2; x < width; x += 3) {
                    const idx = (y * width + x) * 4;
                    const brightness = (data[idx] + data[idx+1] + data[idx+2]) / 3;
                    
                    if (brightness < 100) {
                        charRegions.push({x, y, brightness});
                    }
                }
            }
            
            // BÖLGE HESAPLAMA
            let plateRegion = null;
            
            if (whiteBands.length > 10) {
                // Beyaz bantların ortalama Y pozisyonu
                const avgY = whiteBands.reduce((sum, b) => sum + b.y, 0) / whiteBands.length;
                const bandHeight = whiteBands.length * 2;
                
                // Mavi şeridin ortalama X pozisyonu
                let blueX = 0;
                if (blueRegions.length > 10) {
                    blueX = blueRegions.reduce((sum, b) => sum + b.x, 0) / blueRegions.length;
                }
                
                // Karakter bölgesi
                let charMinX = width, charMaxX = 0;
                if (charRegions.length > 20) {
                    charMinX = Math.min(...charRegions.map(c => c.x));
                    charMaxX = Math.max(...charRegions.map(c => c.x));
                }
                
                plateRegion = {
                    x: Math.max(0, (blueX || width * 0.05) - 10),
                    y: Math.max(0, avgY - bandHeight/2),
                    width: Math.min(width - (blueX || 0), (charMaxX - charMinX) + width * 0.3),
                    height: bandHeight * 1.5,
                    whiteRatio: whiteBands.reduce((sum, b) => sum + b.whiteRatio, 0) / whiteBands.length,
                    blueDetected: blueRegions.length > 20,
                    charDetected: charRegions.length > 50
                };
            }
            
            // Görselleştir
            if (plateRegion) {
                detectedRegions = plateRegion;
                showDetectedRegion(plateRegion, scale);
                
                logDebug(`Bölge tespit edildi: X:${Math.round(plateRegion.x)}, Y:${Math.round(plateRegion.y)}, ` +
                        `W:${Math.round(plateRegion.width)}, H:${Math.round(plateRegion.height)}`);
                logDebug(`Beyaz oranı: ${(plateRegion.whiteRatio * 100).toFixed(1)}%, ` +
                        `Mavi: ${plateRegion.blueDetected}, Karakter: ${plateRegion.charDetected}`);
            } else {
                logDebug('Otomatik tespit başarısız, varsayılan bölge kullanılacak');
                // Varsayılan: Görselin orta kısmı
                detectedRegions = {
                    x: width * 0.1,
                    y: height * 0.3,
                    width: width * 0.8,
                    height: height * 0.4,
                    whiteRatio: 0.5,
                    blueDetected: true,
                    charDetected: true
                };
                showDetectedRegion(detectedRegions, scale);
            }
        }
        
        function showDetectedRegion(region, scale) {
            const overlay = document.getElementById('regionOverlay');
            const img = previewImage;
            
            // Ölçeklendirme oranını hesapla (görsel ekran boyutu vs analiz boyutu)
            const displayWidth = img.clientWidth;
            const displayHeight = img.clientHeight;
            const actualScale = displayWidth / (img.naturalWidth * scale);
            
            const left = (region.x * scale) * actualScale;
            const top = (region.y * scale) * actualScale;
            const width = (region.width * scale) * actualScale;
            const height = (region.height * scale) * actualScale;
            
            overlay.innerHTML = `
                <div class="detected-region" style="
                    left: ${left}px;
                    top: ${top}px;
                    width: ${width}px;
                    height: ${height}px;
                ">
                    <div class="region-label">📍 TESPİT EDİLEN PLAKA BÖLGESİ</div>
                </div>
            `;
        }
        
        // ANA ANALİZ FONKSİYONU
        function analyzePlate() {
            if (!currentImage || !detectedRegions) return;
            
            document.getElementById('loading').classList.add('show');
            analyzeBtn.disabled = true;
            
            setTimeout(() => {
                performSmartAnalysis();
                document.getElementById('loading').classList.remove('show');
                analyzeBtn.disabled = false;
            }, 800);
        }
        
        function performSmartAnalysis() {
            const img = previewImage;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            ctx.drawImage(img, 0, 0);
            
            const width = canvas.width;
            const height = canvas.height;
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            
            // Tespit edilen bölgeyi kullan
            const region = detectedRegions;
            const scaleX = width / (img.clientWidth / (img.clientWidth / (img.naturalWidth * Math.min(1, 800 / img.naturalWidth))));
            const scaleY = height / (img.clientHeight / (img.clientHeight / (img.naturalHeight * Math.min(1, 800 / img.naturalHeight))));
            
            // Gerçek koordinatlar
            const rX = Math.max(0, Math.floor(region.x));
            const rY = Math.max(0, Math.floor(region.y));
            const rW = Math.min(width - rX, Math.floor(region.width));
            const rH = Math.min(height - rY, Math.floor(region.height));
            
            logDebug(`Analiz bölgesi: ${rX},${rY} ${rW}x${rH}`);
            
            // 1. MAVİ ŞERİDİ ANALİZİ (Bölgenin solu)
            const blueStripWidth = Math.min(rW * 0.2, 100);
            let blueScore = 0;
            let bluePixels = 0;
            let totalBlueArea = 0;
            
            for (let y = rY; y < rY + rH; y += 2) {
                for (let x = rX; x < rX + blueStripWidth; x += 2) {
                    const idx = (y * width + x) * 4;
                    const r = data[idx], g = data[idx+1], b = data[idx+2];
                    
                    totalBlueArea++;
                    
                    // Mavi tespiti - geniş tolerans
                    if (b > r + 20 && b > g + 10 && b > 60) {
                        bluePixels++;
                    }
                }
            }
            
            blueScore = (bluePixels / totalBlueArea) * 100;
            
            // 2. BEYAZ ZEMİN ANALİZİ (Bölgenin ortası)
            const plateStartX = rX + blueStripWidth;
            const plateWidth = rW - blueStripWidth;
            
            let whitePixels = 0;
            let grayPixels = 0;
            let totalPlateArea = 0;
            
            for (let y = rY; y < rY + rH; y += 2) {
                for (let x = plateStartX; x < plateStartX + plateWidth; x += 2) {
                    const idx = (y * width + x) * 4;
                    const r = data[idx], g = data[idx+1], b = data[idx+2];
                    const brightness = (r + g + b) / 3;
                    
                    totalPlateArea++;
                    
                    // Beyaz: Yüksek parlaklık, dengeli renkler
                    if (brightness > 140 && Math.abs(r-g) < 40 && Math.abs(r-b) < 40 && Math.abs(g-b) < 40) {
                        whitePixels++;
                    }
                    // Gri (gümüş/gri plaka): Orta parlaklık
                    else if (brightness > 100 && brightness < 180 && Math.abs(r-g) < 30 && Math.abs(r-b) < 30) {
                        grayPixels++;
                    }
                }
            }
            
            const whiteScore = ((whitePixels + grayPixels * 0.7) / totalPlateArea) * 100;
            
            // 3. KARAKTER ANALİZİ (Koyu pikseller)
            let darkPixels = 0;
            let edgePixels = 0;
            let prevBrightness = 0;
            
            for (let y = rY; y < rY + rH; y += 2) {
                for (let x = plateStartX; x < plateStartX + plateWidth; x += 2) {
                    const idx = (y * width + x) * 4;
                    const brightness = (data[idx] + data[idx+1] + data[idx+2]) / 3;
                    
                    if (brightness < 90) darkPixels++;
                    
                    // Kenar tespiti
                    if (prevBrightness > 0 && Math.abs(brightness - prevBrightness) > 80) {
                        edgePixels++;
                    }
                    prevBrightness = brightness;
                }
            }
            
            const charScore = Math.min(100, (darkPixels / totalPlateArea) * 300);
            const edgeScore = Math.min(100, (edgePixels / totalPlateArea) * 1000);
            
            // 4. HOLOGRAM ANALİZİ (Yatay dalgalanma)
            let hologramScore = 0;
            const centerY = rY + rH / 2;
            const bandHeight = rH * 0.15;
            let varianceSum = 0;
            let lineCount = 0;
            
            for (let y = Math.floor(centerY - bandHeight/2); y < centerY + bandHeight/2; y += 3) {
                let lineBrightness = 0;
                let linePixels = 0;
                
                for (let x = plateStartX; x < plateStartX + plateWidth; x += 3) {
                    const idx = (y * width + x) * 4;
                    lineBrightness += (data[idx] + data[idx+1] + data[idx+2]) / 3;
                    linePixels++;
                }
                
                if (linePixels > 0) {
                    varianceSum += Math.pow(lineBrightness / linePixels - 128, 2);
                    lineCount++;
                }
            }
            
            const variance = lineCount > 0 ? varianceSum / lineCount : 0;
            hologramScore = Math.min(100, variance / 50);
            
            // 5. MÜHÜR ANALİZİ (Sol üst köşe)
            const sealSize = Math.min(rW, rH) * 0.25;
            let sealScore = 0;
            let darkSealPixels = 0;
            let sealTotal = 0;
            
            for (let y = rY; y < rY + sealSize && y < rY + rH; y += 2) {
                for (let x = rX; x < rX + sealSize && x < rX + rW; x += 2) {
                    const idx = (y * width + x) * 4;
                    const brightness = (data[idx] + data[idx+1] + data[idx+2]) / 3;
                    
                    sealTotal++;
                    if (brightness < 120) darkSealPixels++;
                }
            }
            
            sealScore = (darkSealPixels / sealTotal) * 100;
            
            // SKOR HESAPLAMA
            const scores = {
                blueStrip: Math.min(100, blueScore * 1.2),
                whiteBg: Math.min(100, whiteScore * 1.1),
                characters: Math.min(100, charScore + edgeScore * 0.3),
                hologram: Math.min(100, hologramScore * 1.5),
                seal: Math.min(100, sealScore * 0.8)
            };
            
            // Ağırlıklar
            const weights = { blue: 25, white: 25, chars: 20, hologram: 15, seal: 15 };
            
            const totalScore = 
                (scores.blueStrip * weights.blue / 100) +
                (scores.whiteBg * weights.white / 100) +
                (scores.characters * weights.chars / 100) +
                (scores.hologram * weights.hologram / 100) +
                (scores.seal * weights.seal / 100);
            
            // DURUM BELİRLEME
            let status, statusClass, title, message;
            
            if (totalScore >= 70) {
                status = 'original';
                statusClass = 'result-original';
                title = '✅ ORİJİNAL PLAKA';
                message = 'Tespit edilen bölgedeki tüm güvenlik özellikleri doğrulandı.';
            } else if (totalScore >= 45) {
                status = 'suspicious';
                statusClass = 'result-suspicious';
                title = '⚠️ KISMEN UYGUN';
                message = 'Bazı özellikler zayıf. Farklı açıdan fotoğraf çekmeyi deneyin.';
            } else {
                status = 'fake';
                statusClass = 'result-fake';
                title = '❌ STANDART DIŞI';
                message = 'Güvenlik özellikleri yetersiz veya plaka bölgesi tespit edilemedi.';
            }
            
            // SONUÇ GÖSTER
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result show';
            
            resultDiv.innerHTML = `
                <div class="result-header ${statusClass}">
                    <div style="font-size: 14px; opacity: 0.9; margin-bottom: 10px;">ANALİZ SONUCU</div>
                    <div class="authenticity-score" style="color: ${status === 'original' ? '#4ade80' : status === 'suspicious' ? '#fbbf24' : '#f87171'}">
                        %${Math.round(totalScore)}
                    </div>
                    <h2 style="margin-bottom: 8px;">${title}</h2>
                    <p style="font-size: 14px; opacity: 0.9; line-height: 1.5;">${message}</p>
                </div>
                
                <div class="features-grid">
                    <div class="feature-card ${scores.blueStrip > 60 ? 'pass' : scores.blueStrip > 30 ? 'warning' : 'fail'}">
                        <div class="feature-icon">${scores.blueStrip > 60 ? '✓' : scores.blueStrip > 30 ? '!' : '✗'}</div>
                        <div class="feature-content">
                            <div class="feature-title">Mavi TR Şeridi</div>
                            <div class="feature-desc">${scores.blueStrip > 60 ? 'Net mavi şerit tespit edildi' : scores.blueStrip > 30 ? 'Zayıf mavi tonları' : 'Mavi şerit bulunamadı'}</div>
                            <div class="detail-values">
                                <div class="detail-value"><span class="detail-label">Skor:</span><span class="detail-number">${Math.round(scores.blueStrip)}%</span></div>
                                <div class="detail-value"><span class="detail-label">Piksel:</span><span class="detail-number">${Math.round(bluePixels)}</span></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="feature-card ${scores.whiteBg > 60 ? 'pass' : scores.whiteBg > 30 ? 'warning' : 'fail'}">
                        <div class="feature-icon">${scores.whiteBg > 60 ? '✓' : scores.whiteBg > 30 ? '!' : '✗'}</div>
                        <div class="feature-content">
                            <div class="feature-title">Beyaz Zemin</div>
                            <div class="feature-desc">${scores.whiteBg > 60 ? 'Standart beyaz/gri zemin' : scores.whiteBg > 30 ? 'Zemin rengi düşük' : 'Zemin tespit edilemedi'}</div>
                            <div class="detail-values">
                                <div class="detail-value"><span class="detail-label">Skor:</span><span class="detail-number">${Math.round(scores.whiteBg)}%</span></div>
                                <div class="detail-value"><span class="detail-label">Beyaz:</span><span class="detail-number">${Math.round(whitePixels)}</span></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="feature-card ${scores.characters > 60 ? 'pass' : scores.characters > 30 ? 'warning' : 'fail'}">
                        <div class="feature-icon">${scores.characters > 60 ? '✓' : scores.characters > 30 ? '!' : '✗'}</div>
                        <div class="feature-content">
                            <div class="feature-title">Karakter Netliği</div>
                            <div class="feature-desc">${scores.characters > 60 ? 'Net siyah karakterler' : scores.characters > 30 ? 'Karakterler belirsiz' : 'Karakter bulunamadı'}</div>
                            <div class="detail-values">
                                <div class="detail-value"><span class="detail-label">Skor:</span><span class="detail-number">${Math.round(scores.characters)}%</span></div>
                                <div class="detail-value"><span class="detail-label">Kenar:</span><span class="detail-number">${Math.round(edgeScore)}</span></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="feature-card ${scores.hologram > 50 ? 'pass' : scores.hologram > 25 ? 'warning' : 'fail'}">
                        <div class="feature-icon">${scores.hologram > 50 ? '✓' : scores.hologram > 25 ? '!' : '✗'}</div>
                        <div class="feature-content">
                            <div class="feature-title">Hologram Şeridi</div>
                            <div class="feature-desc">${scores.hologram > 50 ? 'Dalgalı hologram deseni var' : scores.hologram > 25 ? 'Hologram zayıf' : 'Hologram tespit edilemedi'}</div>
                            <div class="detail-values">
                                <div class="detail-value"><span class="detail-label">Skor:</span><span class="detail-number">${Math.round(scores.hologram)}%</span></div>
                                <div class="detail-value"><span class="detail-label">Varyans:</span><span class="detail-number">${Math.round(variance)}</span></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="feature-card ${scores.seal > 40 ? 'pass' : scores.seal > 20 ? 'warning' : 'fail'}">
                        <div class="feature-icon">${scores.seal > 40 ? '✓' : scores.seal > 20 ? '!' : '✗'}</div>
                        <div class="feature-content">
                            <div class="feature-title">Mühür/Damga</div>
                            <div class="feature-desc">${scores.seal > 40 ? 'Sol üst mühürü tespit edildi' : scores.seal > 20 ? 'Mühür belirsiz' : 'Mühür bulunamadı'}</div>
                            <div class="detail-values">
                                <div class="detail-value"><span class="detail-label">Skor:</span><span class="detail-number">${Math.round(scores.seal)}%</span></div>
                                <div class="detail-value"><span class="detail-label">Koyu:</span><span class="detail-number">${Math.round(darkSealPixels)}</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            logDebug(`Final skor: ${totalScore.toFixed(1)}`);
        }
    </script>
</body>
</html>
