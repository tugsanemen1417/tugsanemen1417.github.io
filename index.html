<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plaka Forensik Analiz Pro v5.4</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050508;
    --bg2: #0a0c10;
    --bg3: #111318;
    --amber: #f0a500;
    --amber-dim: #f0a50015;
    --red: #ff3a3a;
    --red-dim: #ff3a3a12;
    --green: #00e87a;
    --green-dim: #00e87a12;
    --cyan: #00d4ff;
    --cyan-dim: #00d4ff10;
    --text: #e8ecf1;
    --muted: #5a6270;
    --border: #1e232c;
    --border2: #2a303c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    line-height: 1.6;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 120% 100% at 50% 0%, #0d1320 0%, transparent 60%), var(--bg);
    z-index: -3;
  }

  .container {
    position: relative;
    z-index: 2;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }

  header {
    padding: 32px 0 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--border2);
    margin-bottom: 36px;
    position: relative;
  }

  header::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, var(--amber), transparent);
  }

  .header-icon {
    width: 48px;
    height: 48px;
    background: var(--amber-dim);
    border: 1px solid var(--amber);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }

  .header-text h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: 3px;
    color: var(--amber);
    text-shadow: 0 0 20px rgba(240, 165, 0, 0.2);
  }

  .header-text p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .status-badge {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--green-dim);
    border: 1px solid var(--green);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--green);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse-green 1.5s infinite;
    box-shadow: 0 0 8px var(--green);
  }

  @keyframes pulse-green {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .upload-zone {
    border: 2px dashed var(--border2);
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    background: rgba(17, 19, 24, 0.5);
    min-height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }

  .upload-zone:hover {
    border-color: var(--amber);
    background: var(--amber-dim);
    transform: translateY(-2px);
    box-shadow: 0 10px 40px rgba(240, 165, 0, 0.1);
  }

  .upload-zone.drag-over {
    border-color: var(--cyan);
    background: var(--cyan-dim);
  }

  .upload-zone.has-image {
    padding: 10px;
    border-style: solid;
    border-color: var(--amber);
    min-height: auto;
  }

  .upload-zone img {
    max-width: 100%;
    max-height: 300px;
    border-radius: 8px;
  }

  .upload-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.6; }
  .upload-title { font-weight: 600; font-size: 16px; color: var(--text); margin-bottom: 6px; }
  .upload-sub { font-size: 13px; color: var(--muted); }

  #fileInput { display: none; }

  .btn-group {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .analyze-btn {
    flex: 1;
    padding: 14px;
    background: linear-gradient(135deg, var(--amber), #c78500);
    border: none;
    border-radius: 10px;
    color: #000;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.3s;
    font-weight: 700;
  }

  .analyze-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(240, 165, 0, 0.2);
  }

  .analyze-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .analyze-btn.analyzing {
    background: linear-gradient(135deg, var(--cyan), #0099cc);
    color: white;
  }

  .reset-btn {
    padding: 14px 24px;
    background: transparent;
    border: 1px solid var(--border2);
    border-radius: 10px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .reset-btn:hover { 
    border-color: var(--amber); 
    color: var(--amber);
    background: var(--amber-dim);
  }

  .log-panel {
    background: rgba(10, 12, 16, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border2);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .log-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(17, 19, 24, 0.8);
  }

  .log-area {
    background: rgba(5, 5, 8, 0.6);
    border: 1px solid var(--border);
    margin: 12px;
    border-radius: 10px;
    padding: 14px;
    height: 250px;
    overflow-y: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }

  .log-area::-webkit-scrollbar { width: 4px; }
  .log-area::-webkit-scrollbar-track { background: var(--bg3); }
  .log-area::-webkit-scrollbar-thumb { background: var(--amber); border-radius: 2px; }

  .log-entry {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
    animation: fadeIn 0.3s ease;
    align-items: flex-start;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-6px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .log-time { color: var(--muted); flex-shrink: 0; font-size: 10px; }
  .log-tag {
    flex-shrink: 0;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .log-tag.info { background: var(--cyan-dim); color: var(--cyan); border: 1px solid rgba(0, 212, 255, 0.2); }
  .log-tag.warn { background: rgba(255, 153, 0, 0.1); color: #ff9900; border: 1px solid rgba(255, 153, 0, 0.2); }
  .log-tag.pass { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0, 232, 122, 0.2); }
  .log-tag.fail { background: var(--red-dim); color: var(--red); border: 1px solid rgba(255, 58, 58, 0.2); }
  .log-tag.scan { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(240, 165, 0, 0.2); }
  .log-msg { color: var(--text); line-height: 1.5; flex: 1; }

  .empty-state {
    color: var(--muted);
    text-align: center;
    padding: 40px;
    opacity: 0.6;
  }

  .result-card {
    display: none;
    background: rgba(10, 12, 16, 0.8);
    backdrop-filter: blur(10px);
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border2);
    animation: slideUp 0.5s ease;
    margin-bottom: 20px;
  }

  .result-card.visible { display: block; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-banner {
    padding: 28px;
    display: flex;
    align-items: center;
    gap: 20px;
    position: relative;
  }

  .result-banner.original { background: linear-gradient(135deg, rgba(0, 232, 122, 0.08) 0%, transparent 60%); border-bottom: 1px solid rgba(0, 232, 122, 0.3); }
  .result-banner.fake { background: linear-gradient(135deg, rgba(255, 58, 58, 0.08) 0%, transparent 60%); border-bottom: 1px solid rgba(255, 58, 58, 0.3); }
  .result-banner.suspicious { background: linear-gradient(135deg, rgba(255, 153, 0, 0.08) 0%, transparent 60%); border-bottom: 1px solid rgba(255, 153, 0, 0.3); }
  .result-banner.not-plate { background: linear-gradient(135deg, rgba(100, 100, 100, 0.15) 0%, transparent 60%); border-bottom: 1px solid rgba(100, 100, 100, 0.4); }

  .result-icon-big { font-size: 48px; line-height: 1; flex-shrink: 0; }
  .result-info { flex: 1; }
  .result-info h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    letter-spacing: 3px;
    line-height: 1;
    margin-bottom: 8px;
  }
  .result-info h2.green { color: var(--green); }
  .result-info h2.red { color: var(--red); }
  .result-info h2.orange { color: #ff9900; }
  .result-info h2.gray { color: #888; }

  .result-info p { font-size: 14px; color: var(--muted); }

  .score-circle {
    margin-left: auto;
    width: 80px;
    height: 80px;
    position: relative;
    flex-shrink: 0;
  }

  .score-circle svg {
    transform: rotate(-90deg);
    width: 80px;
    height: 80px;
  }

  .score-circle .track { fill: none; stroke: var(--border2); stroke-width: 6; }
  .score-circle .fill { fill: none; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }

  .score-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
  }

  .score-num { font-size: 22px; font-weight: 700; line-height: 1; }
  .score-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

  .detail-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
  }

  @media (max-width: 768px) {
    .detail-grid { grid-template-columns: repeat(2, 1fr); }
    .result-banner { flex-direction: column; text-align: center; }
    .score-circle { margin: 20px auto 0; }
    .btn-group { flex-direction: column; }
  }

  .detail-cell {
    background: rgba(17, 19, 24, 0.5);
    padding: 14px;
    transition: all 0.2s;
  }

  .detail-cell:hover { background: rgba(26, 29, 36, 0.8); }
  .detail-cell-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
  .detail-cell-value { font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 700; }
  .detail-cell-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .loading-spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-icon">🔍</div>
    <div class="header-text">
      <h1>PLATE FORENSICS PRO</h1>
      <p>Gelişmiş Plaka Doğrulama & Sahtecilik Tespiti</p>
    </div>
    <div class="status-badge">
      <div class="status-dot"></div>
      SİSTEM AKTİF
    </div>
  </header>

  <div class="upload-zone" id="uploadZone">
    <div class="upload-icon" id="uploadIcon">📷</div>
    <div class="upload-title" id="uploadTitle">Fotoğraf Seç veya Sürükle</div>
    <div class="upload-sub" id="uploadSub">JPG, PNG, WEBP — Max 20MB</div>
    <img id="previewImg" style="display:none;" />
  </div>
  <input type="file" id="fileInput" accept="image/*">

  <div class="btn-group">
    <button class="analyze-btn" id="analyzeBtn" disabled>
      🔬 ANALİZİ BAŞLAT
    </button>
    <button class="reset-btn" id="resetBtn" style="display:none;">
      ↺ Sıfırla
    </button>
  </div>

  <div class="log-panel">
    <div class="log-header">
      <div class="panel-dot" style="background:var(--cyan)"></div>
      <span class="panel-title" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;">Canlı Analiz Logu</span>
      <span style="margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)" id="logCount">0 KAYIT</span>
    </div>
    <div class="log-area" id="logArea">
      <div class="empty-state">
        📋 Analiz başladığında kayıtlar burada görünecek...
      </div>
    </div>
  </div>

  <div class="result-card" id="resultCard"></div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
const state = {
  imageData: null,
  logCount: 0,
  isAnalyzing: false,
  fileName: ''
};

const elements = {
  fileInput: document.getElementById('fileInput'),
  uploadZone: document.getElementById('uploadZone'),
  previewImg: document.getElementById('previewImg'),
  uploadIcon: document.getElementById('uploadIcon'),
  uploadTitle: document.getElementById('uploadTitle'),
  uploadSub: document.getElementById('uploadSub'),
  analyzeBtn: document.getElementById('analyzeBtn'),
  resetBtn: document.getElementById('resetBtn'),
  logArea: document.getElementById('logArea'),
  logCount: document.getElementById('logCount'),
  resultCard: document.getElementById('resultCard'),
  canvas: document.getElementById('canvas')
};

function addLog(tag, msg) {
  const area = elements.logArea;
  if (state.logCount === 0) area.innerHTML = '';
  
  state.logCount++;
  elements.logCount.textContent = `${state.logCount} KAYIT`;
  
  const now = new Date();
  const time = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
  
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `
    <span class="log-time">${time}</span>
    <span class="log-tag ${tag}">${tag.toUpperCase()}</span>
    <span class="log-msg">${msg}</span>
  `;
  
  area.appendChild(entry);
  area.scrollTop = area.scrollHeight;
}

function handleFile(file) {
  if (!file) return;
  
  const acceptedTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/jpg'];
  if (!acceptedTypes.includes(file.type)) {
    addLog('fail', `❌ Desteklenmeyen format`);
    return;
  }
  
  if (file.size > 20 * 1024 * 1024) {
    addLog('fail', `❌ Dosya çok büyük`);
    return;
  }

  state.fileName = file.name;
  const reader = new FileReader();
  
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      elements.previewImg.src = ev.target.result;
      elements.previewImg.style.display = 'block';
      elements.uploadIcon.style.display = 'none';
      elements.uploadTitle.style.display = 'none';
      elements.uploadSub.style.display = 'none';
      elements.uploadZone.classList.add('has-image');
      elements.analyzeBtn.disabled = false;
      elements.resetBtn.style.display = 'block';
      state.imageData = ev.target.result;
      
      elements.logArea.innerHTML = '';
      addLog('info', `✅ Görüntü yüklendi: ${file.name}`);
      addLog('info', `📐 Boyut: ${img.width}×${img.height}px`);
      
      elements.resultCard.className = 'result-card';
      state.logCount = 0;
    };
    img.src = ev.target.result;
  };
  
  reader.readAsDataURL(file);
}

function resetAll() {
  state.imageData = null;
  state.logCount = 0;
  state.isAnalyzing = false;
  state.fileName = '';
  
  elements.fileInput.value = '';
  elements.previewImg.style.display = 'none';
  elements.previewImg.src = '';
  elements.uploadIcon.style.display = 'block';
  elements.uploadTitle.style.display = 'block';
  elements.uploadSub.style.display = 'block';
  elements.uploadZone.classList.remove('has-image');
  elements.analyzeBtn.disabled = true;
  elements.analyzeBtn.textContent = '🔬 ANALİZİ BAŞLAT';
  elements.analyzeBtn.classList.remove('analyzing');
  elements.resetBtn.style.display = 'none';
  
  elements.logArea.innerHTML = `
    <div class="empty-state">
      📋 Analiz başladığında kayıtlar burada görünecek...
    </div>
  `;
  
  elements.logCount.textContent = '0 KAYIT';
  elements.resultCard.className = 'result-card';
}

class PlateAnalyzer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { willReadFrequently: true });
    this.width = 0;
    this.height = 0;
    this.gray = null;
  }

  async loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth;
        let h = img.naturalHeight;
        const maxDim = 1000;
        
        if (w > maxDim || h > maxDim) {
          const ratio = Math.min(maxDim / w, maxDim / h);
          w = Math.floor(w * ratio);
          h = Math.floor(h * ratio);
        }
        
        this.canvas.width = w;
        this.canvas.height = h;
        this.ctx.drawImage(img, 0, 0, w, h);
        
        this.width = w;
        this.height = h;
        this.preprocess();
        
        resolve({ width: w, height: h });
      };
      img.onerror = reject;
      img.src = src;
    });
  }

  preprocess() {
    const imgData = this.ctx.getImageData(0, 0, this.width, this.height);
    const data = imgData.data;
    this.gray = new Float32Array(this.width * this.height);
    
    for (let i = 0; i < data.length; i += 4) {
      const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      this.gray[i / 4] = gray;
    }
  }

  detectPlate() {
    // Basit ama etkili: Görüntüyü ızgara olarak tara, en iyi puanı al
    const candidates = [];
    const aspectRatios = [3.5, 4.0, 4.5, 5.0, 5.5];
    const scales = [0.4, 0.6, 0.8];
    
    for (const scale of scales) {
      const h = Math.floor(this.height * scale * 0.2);
      if (h < 30) continue;
      
      for (const aspect of aspectRatios) {
        const w = Math.floor(h * aspect);
        if (w > this.width * 0.9) continue;
        
        // 10 piksel adımla tara
        for (let y = 20; y < this.height - h - 20; y += 20) {
          for (let x = 20; x < this.width - w - 20; x += 20) {
            const score = this.evaluateRegion(x, y, w, h);
            if (score.total > 0.5) {
              candidates.push({ x, y, width: w, height: h, score: score.total, details: score });
            }
          }
        }
      }
    }
    
    candidates.sort((a, b) => b.score - a.score);
    
    // Non-maximum suppression
    const filtered = [];
    for (const cand of candidates) {
      let overlap = false;
      for (const sel of filtered) {
        const iou = this.calculateIoU(cand, sel);
        if (iou > 0.5) {
          overlap = true;
          break;
        }
      }
      if (!overlap && filtered.length < 5) {
        filtered.push(cand);
      }
    }
    
    // Hiç bulunamazsa merkezi dene
    if (filtered.length === 0) {
      const cx = this.width / 2;
      const cy = this.height / 2;
      const w = this.width * 0.5;
      const h = w / 4.5;
      const score = this.evaluateRegion(cx - w/2, cy - h/2, w, h);
      filtered.push({
        x: cx - w/2,
        y: cy - h/2,
        width: w,
        height: h,
        score: score.total * 0.8,
        details: score
      });
    }
    
    return {
      detected: filtered.length > 0,
      best: filtered[0],
      candidates: filtered
    };
  }

  evaluateRegion(x, y, w, h) {
    let whiteCount = 0, blackCount = 0, edgeCount = 0, total = 0;
    const localHist = new Array(256).fill(0);
    
    for (let iy = Math.floor(y); iy < y + h && iy < this.height; iy++) {
      for (let ix = Math.floor(x); ix < x + w && ix < this.width; ix++) {
        const val = this.gray[iy * this.width + ix];
        localHist[Math.floor(val)]++;
        total++;
        
        if (val > 120 && val < 220) whiteCount++;
        if (val < 80) blackCount++;
        
        // Basit edge kontrolü (komşu piksel farkı)
        if (ix < x + w - 1) {
          const next = this.gray[iy * this.width + (ix + 1)];
          if (Math.abs(val - next) > 40) edgeCount++;
        }
      }
    }
    
    const whiteRatio = total > 0 ? whiteCount / total : 0;
    const blackRatio = total > 0 ? blackCount / total : 0;
    const edgeRatio = total > 0 ? edgeCount / total : 0;
    
    // Histogram dengesi (peaki olmayan = düz renk değil)
    let maxHist = 0;
    for (let i = 0; i < 256; i++) {
      if (localHist[i] > maxHist) maxHist = localHist[i];
    }
    const balance = 1 - (maxHist / total);
    
    return {
      white: whiteRatio,
      black: blackRatio,
      edge: edgeRatio,
      balance: balance,
      total: (whiteRatio > 0.3 ? 0.3 : 0) + 
             (blackRatio > 0.1 ? 0.3 : 0) + 
             (edgeRatio > 0.05 ? 0.2 : 0) +
             (balance > 0.7 ? 0.2 : 0)
    };
  }

  calculateIoU(a, b) {
    const x1 = Math.max(a.x, b.x);
    const y1 = Math.max(a.y, b.y);
    const x2 = Math.min(a.x + a.width, b.x + b.width);
    const y2 = Math.min(a.y + a.height, b.y + b.height);
    
    const intersection = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
    const union = a.width * a.height + b.width * b.height - intersection;
    
    return union > 0 ? intersection / union : 0;
  }

  analyzeCharacters(roi) {
    if (!roi) return { valid: false, score: 0 };
    
    const { x, y, width, height } = roi;
    const rowSum = new Array(Math.floor(height)).fill(0);
    
    for (let iy = 0; iy < height; iy++) {
      for (let ix = 0; ix < width; ix++) {
        const idx = Math.floor((y + iy) * this.width + (x + ix));
        if (idx < this.gray.length && this.gray[idx] < 100) {
          rowSum[iy]++;
        }
      }
    }
    
    let peaks = 0;
    let inPeak = false;
    for (let i = 0; i < rowSum.length; i++) {
      const density = rowSum[i] / width;
      if (density > 0.1 && !inPeak) {
        inPeak = true;
        peaks++;
      } else if (density < 0.05 && inPeak) {
        inPeak = false;
      }
    }
    
    return { valid: peaks >= 1, score: Math.min(100, peaks * 25 + 30), peaks };
  }

  detectTampering() {
    const hist = new Array(256).fill(0);
    for (const val of this.gray) {
      hist[Math.floor(val)]++;
    }
    
    let entropy = 0;
    const total = this.gray.length;
    for (let i = 0; i < 256; i++) {
      if (hist[i] > 0) {
        const p = hist[i] / total;
        entropy -= p * Math.log2(p);
      }
    }
    
    return { entropy: entropy.toFixed(2), isSuspicious: entropy < 4, score: entropy < 4 ? 20 : 90 };
  }
}

async function startAnalysis() {
  if (!state.imageData || state.isAnalyzing) return;
  
  state.isAnalyzing = true;
  const btn = elements.analyzeBtn;
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner"></span> ANALİZ EDİLİYOR...';
  btn.classList.add('analyzing');
  
  elements.resultCard.className = 'result-card';
  state.logCount = 0;
  elements.logArea.innerHTML = '';

  try {
    addLog('info', '🔬 Analiz başlatılıyor...');
    
    const analyzer = new PlateAnalyzer(elements.canvas);
    
    addLog('info', '📐 Görüntü işleniyor...');
    const { width, height } = await analyzer.loadImage(state.imageData);
    
    addLog('scan', '🔍 Plaka bölgesi aranıyor...');
    const plate = analyzer.detectPlate();
    
    if (!plate.detected) {
      addLog('fail', '❌ Plaka bulunamadı');
      showResult('PLAKA BULUNAMADI', 'not-plate', '❌', 0, width, height, null, null, null);
      return;
    }
    
    const best = plate.best;
    addLog('pass', `✅ Plaka adayı bulundu (Skor: ${(best.score*100).toFixed(0)}%)`);
    addLog('info', `📊 Beyaz: ${(best.details.white*100).toFixed(0)}% | Siyah: ${(best.details.black*100).toFixed(0)}%`);
    
    addLog('scan', '📝 Karakter analizi...');
    const chars = analyzer.analyzeCharacters(best);
    addLog(chars.valid ? 'pass' : 'warn', `${chars.peaks} karakter satırı tespit edildi`);
    
    addLog('scan', '🔐 Entropy kontrolü...');
    const tamper = analyzer.detectTampering();
    addLog(tamper.isSuspicious ? 'warn' : 'pass', `Entropy: ${tamper.entropy}`);
    
    // Karar
    let verdict, type, icon, score;
    const baseScore = (best.score * 100 + chars.score + tamper.score) / 3;
    
    if (best.score > 0.6 && chars.valid && !tamper.isSuspicious) {
      verdict = 'ORİJİNAL PLAKA';
      type = 'original';
      icon = '✅';
      score = Math.min(95, baseScore);
    } else if (tamper.isSuspicious) {
      verdict = 'SAHTE PLAKA';
      type = 'fake';
      icon = '🚨';
      score = 30;
    } else if (best.score > 0.4) {
      verdict = 'KUŞKULU PLAKA';
      type = 'suspicious';
      icon = '⚠️';
      score = Math.min(70, baseScore);
    } else {
      verdict = 'GEÇERSİZ';
      type = 'not-plate';
      icon = '❌';
      score = Math.min(35, baseScore);
    }
    
    showResult(verdict, type, icon, score, width, height, best, chars, tamper);
    
  } catch (error) {
    addLog('fail', `❌ Hata: ${error.message}`);
  } finally {
    state.isAnalyzing = false;
    btn.disabled = false;
    btn.textContent = '🔬 ANALİZİ BAŞLAT';
    btn.classList.remove('analyzing');
  }
}

function showResult(verdict, type, icon, score, w, h, roi, chars, tamper) {
  const card = elements.resultCard;
  const circ = 2 * Math.PI * 35;
  const color = type === 'original' ? '#00e87a' : type === 'fake' ? '#ff3a3a' : type === 'suspicious' ? '#ff9900' : '#888';
  
  const roiInfo = roi ? `
    <div class="detail-cell">
      <div class="detail-cell-label">Plaka Boyutu</div>
      <div class="detail-cell-value" style="color:var(--amber)">${Math.floor(roi.width)}×${Math.floor(roi.height)}</div>
    </div>
    <div class="detail-cell">
      <div class="detail-cell-label">Oran</div>
      <div class="detail-cell-value" style="color:var(--amber)">${(roi.width/roi.height).toFixed(1)}</div>
    </div>
  ` : '';
  
  const charInfo = chars ? `
    <div class="detail-cell">
      <div class="detail-cell-label">Karakter</div>
      <div class="detail-cell-value" style="color:${chars.valid ? 'var(--green)' : 'var(--red)'}">${chars.peaks} satır</div>
    </div>
  ` : '';
  
  const tamperInfo = tamper ? `
    <div class="detail-cell">
      <div class="detail-cell-label">Entropy</div>
      <div class="detail-cell-value" style="color:${tamper.isSuspicious ? 'var(--red)' : 'var(--green)'}">${tamper.entropy}</div>
    </div>
  ` : '';
  
  card.innerHTML = `
    <div class="result-banner ${type}">
      <div class="result-icon-big">${icon}</div>
      <div class="result-info">
        <h2 class="${type === 'original' ? 'green' : type === 'fake' ? 'red' : type === 'suspicious' ? 'orange' : 'gray'}">${verdict}</h2>
        <p>${type === 'original' ? 'Plaka yapısı doğrulandı' : type === 'fake' ? 'Sahtecilik tespit edildi' : 'Analiz tamamlandı'}</p>
      </div>
      <div class="score-circle">
        <svg viewBox="0 0 80 80">
          <circle class="track" cx="40" cy="40" r="35"/>
          <circle class="fill" cx="40" cy="40" r="35" stroke="${color}" stroke-dasharray="${circ}" stroke-dashoffset="${circ - (score/100)*circ}"/>
        </svg>
        <div class="score-text">
          <span class="score-num" style="color:${color}">${Math.round(score)}</span>
          <span class="score-label">SKOR</span>
        </div>
      </div>
    </div>
    <div class="detail-grid">
      <div class="detail-cell">
        <div class="detail-cell-label">Görüntü</div>
        <div class="detail-cell-value" style="color:var(--cyan)">${w}×${h}</div>
      </div>
      ${roiInfo}
      ${charInfo}
      ${tamperInfo}
    </div>
  `;
  
  card.className = 'result-card visible';
  card.scrollIntoView({ behavior: 'smooth' });
}

// Events
elements.uploadZone.addEventListener('click', () => {
  if (!state.isAnalyzing) elements.fileInput.click();
});

elements.fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) handleFile(file);
});

elements.analyzeBtn.addEventListener('click', startAnalysis);
elements.resetBtn.addEventListener('click', resetAll);

elements.uploadZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  if (!state.isAnalyzing) elements.uploadZone.classList.add('drag-over');
});

elements.uploadZone.addEventListener('dragleave', () => {
  elements.uploadZone.classList.remove('drag-over');
});

elements.uploadZone.addEventListener('drop', (e) => {
  e.preventDefault();
  elements.uploadZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) handleFile(file);
});
</script>
</body>
</html>
