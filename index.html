<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Plaka APP / Standart / Sahte Kontrolü</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;text-align:center;margin-top:40px}
    #result{font-size:1.5em;margin-top:20px;font-weight:bold}
    button:disabled{opacity:.6;cursor:not-allowed}
  </style>
</head>
<body>

  <h2>Türkçe Plaka APP / Standart / Sahte Tespiti</h2>
  <input type="file" id="imageUpload" accept="image/*">
  <br><br>
  <button id="checkBtn" disabled>Sorgula</button>
  <div id="result">Sonuç burada görünecek</div>

  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
  <!-- Model yüklenecek -->
  <script>
    const MODEL_URL = 'model_web/model.json';   // <-- TODO: kendi model klasörünüz
    const LABELS  = ['Amator','Standart','Sahte'];
    let model;

    async function loadModel(){
      model = await tf.loadLayersModel(MODEL_URL);
      document.getElementById('checkBtn').disabled = false;
      document.getElementById('result').innerText = 'Model yüklendi, sorgulamaya hazır.';
    }
    loadModel();

    // Görüntüyü 224x224 boyutlandırır ve normalize eder
    function preprocess(imgElement){
      return tf.tidy(()=>{
        let tensor = tf.browser.fromPixels(imgElement)
                      .resizeNearestNeighbor([224,224])
                      .toFloat()
                      .div(255.0)
                      .expandDims(0);
        return tensor;
      });
    }

    document.getElementById('checkBtn').onclick = async ()=>{
      const fileInput = document.getElementById('imageUpload');
      if(!fileInput.files.length){ alert('Lütfen bir fotoğraf seçin'); return; }

      const img = document.createElement('img');
      img.src = URL.createObjectURL(fileInput.files[0]);
      img.onload = async ()=>{
        const tensor = preprocess(img);
        const pred   = model.predict(tensor).dataSync();  // [prob1,prob2,prob3]
        const idx    = pred.indexOf(Math.max(...pred));
        const prob   = (pred[idx]*100).toFixed(1);

        document.getElementById('result').innerText =
          `Sonuç: ${LABELS[idx]} (${prob}%)`;

        tf.dispose(tensor);
        URL.revokeObjectURL(img.src);
      };
    };
  </script>
</body>
</html>
